<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Cube Simulator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #151719;
            color: #f8fafc;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: #151719;
        }

        button {
            font: inherit;
        }

        .app {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            min-height: 100vh;
        }

        .stage {
            position: relative;
            min-width: 0;
            background:
                radial-gradient(circle at 28% 22%, rgba(255, 255, 255, 0.09), transparent 30%),
                linear-gradient(145deg, #272b30 0%, #111315 100%);
        }

        #cubeCanvas {
            display: block;
            width: 100%;
            height: 100vh;
            cursor: grab;
            touch-action: none;
        }

        #cubeCanvas:active {
            cursor: grabbing;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
            height: 100vh;
            padding: 20px;
            overflow-y: auto;
            background: #f5f7f8;
            border-left: 1px solid #d6d9dd;
            color: #171a1d;
        }

        .panel h1 {
            margin: 0;
            color: #171a1d;
            font-size: 1.2rem;
            font-weight: 760;
            letter-spacing: 0;
        }

        .section-title {
            margin: 0 0 10px;
            color: #3c4248;
            font-size: 0.78rem;
            font-weight: 760;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .moves {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .move-row {
            display: grid;
            grid-template-columns: 82px repeat(3, 58px);
            gap: 8px;
            align-items: center;
        }

        .color-label {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            color: #24282d;
            font-size: 0.9rem;
            font-weight: 720;
        }

        .swatch {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            border: 1px solid rgba(17, 24, 39, 0.28);
            border-radius: 4px;
            background: var(--face);
        }

        .sticker-button {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            padding: 6px;
            border: 1px solid rgba(20, 24, 28, 0.3);
            border-radius: 8px;
            background: #ffffff;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
        }

        .sticker-button:hover {
            transform: translateY(-1px);
            border-color: rgba(20, 24, 28, 0.48);
            box-shadow: 0 5px 14px rgba(15, 23, 42, 0.16);
        }

        .sticker-button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .sticker-face {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(17, 24, 39, 0.68);
            border-radius: 5px;
            background: var(--face);
            color: var(--ink);
        }

        .turn-symbol {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            font-size: 31px;
            font-weight: 900;
            line-height: 1;
        }

        .turn-symbol.half {
            align-items: end;
            padding-bottom: 4px;
            font-size: 16px;
            letter-spacing: 0;
        }

        .toolbar {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .command {
            min-height: 42px;
            border: 1px solid #c8cdd2;
            border-radius: 8px;
            background: #ffffff;
            color: #1f2429;
            cursor: pointer;
            font-weight: 700;
        }

        .command:hover {
            border-color: #8c949d;
            background: #eef1f4;
        }

        .history {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 92px;
            padding: 10px;
            border: 1px solid #d1d6db;
            border-radius: 8px;
            background: #ffffff;
            align-content: flex-start;
        }

        .empty-history {
            color: #6b747d;
            font-size: 0.88rem;
        }

        .history-chip {
            display: inline-grid;
            grid-template-columns: 16px 20px;
            gap: 4px;
            align-items: center;
            min-height: 26px;
            padding: 3px 6px;
            border: 1px solid #cbd1d7;
            border-radius: 7px;
            background: #f9fafb;
        }

        .history-chip .swatch {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        .history-chip .turn-symbol {
            width: 18px;
            height: 18px;
            color: #1f2933;
            font-size: 17px;
        }

        .history-chip .turn-symbol.half {
            align-items: center;
            padding-bottom: 0;
            font-size: 11px;
            color: #1f2933;
        }

        @media (max-width: 820px) {
            body {
                overflow: auto;
            }

            .app {
                grid-template-columns: 1fr;
                min-height: 100vh;
            }

            .stage {
                height: 58vh;
                min-height: 360px;
            }

            #cubeCanvas {
                height: 100%;
            }

            .panel {
                height: auto;
                min-height: 42vh;
                border-left: 0;
                border-top: 1px solid #d6d9dd;
            }

            .move-row {
                grid-template-columns: 82px repeat(3, minmax(52px, 1fr));
            }

            .sticker-button {
                width: 100%;
                max-width: 66px;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="stage" aria-label="Rubik's cube view">
            <canvas id="cubeCanvas"></canvas>
        </section>

        <aside class="panel" aria-label="Rubik's cube controls">
            <h1>Rubik's Cube</h1>

            <section>
                <h2 class="section-title">Moves</h2>
                <div id="moveGrid" class="moves"></div>
            </section>

            <section>
                <h2 class="section-title">Controls</h2>
                <div class="toolbar">
                    <button id="scrambleButton" class="command" type="button">Scramble</button>
                    <button id="resetButton" class="command" type="button">Reset</button>
                    <button id="undoButton" class="command" type="button">Undo</button>
                </div>
            </section>

            <section>
                <h2 class="section-title">History</h2>
                <div id="history" class="history" aria-live="polite"></div>
            </section>
        </aside>
    </main>

    <script>
        (() => {
            const canvas = document.getElementById("cubeCanvas");
            const ctx = canvas.getContext("2d");
            const moveGrid = document.getElementById("moveGrid");
            const historyEl = document.getElementById("history");
            const scrambleButton = document.getElementById("scrambleButton");
            const resetButton = document.getElementById("resetButton");
            const undoButton = document.getElementById("undoButton");

            const FACE_DISTANCE = 1.5;
            const STICKER_STEP = 1;
            const STICKER_HALF = 0.39;
            const PLASTIC_HALF = 0.5;
            const MOVE_MS = 210;
            const HALF_MOVE_MS = 290;

            const faces = {
                white: {
                    label: "White",
                    color: "#f8fafc",
                    ink: "#111827",
                    normal: [0, 1, 0],
                    right: [1, 0, 0],
                    up: [0, 0, -1]
                },
                yellow: {
                    label: "Yellow",
                    color: "#ffd84d",
                    ink: "#111827",
                    normal: [0, -1, 0],
                    right: [1, 0, 0],
                    up: [0, 0, 1]
                },
                green: {
                    label: "Green",
                    color: "#1fb45b",
                    ink: "#f8fafc",
                    normal: [0, 0, 1],
                    right: [1, 0, 0],
                    up: [0, 1, 0]
                },
                blue: {
                    label: "Blue",
                    color: "#2457d6",
                    ink: "#f8fafc",
                    normal: [0, 0, -1],
                    right: [-1, 0, 0],
                    up: [0, 1, 0]
                },
                red: {
                    label: "Red",
                    color: "#dc2626",
                    ink: "#f8fafc",
                    normal: [1, 0, 0],
                    right: [0, 0, -1],
                    up: [0, 1, 0]
                },
                orange: {
                    label: "Orange",
                    color: "#f97316",
                    ink: "#111827",
                    normal: [-1, 0, 0],
                    right: [0, 0, 1],
                    up: [0, 1, 0]
                }
            };

            const faceOrder = ["white", "yellow", "green", "blue", "red", "orange"];
            const moveTypes = [
                { key: "ccw", turn: 1, label: "90 counter-clockwise" },
                { key: "cw", turn: -1, label: "90 clockwise" },
                { key: "half", turn: 2, label: "180 degrees" }
            ];

            let stickers = [];
            let yaw = -0.56;
            let pitch = 0.48;
            let dragging = false;
            let lastPointer = { x: 0, y: 0 };
            let animation = null;
            let queue = [];
            let moveHistory = [];
            let logicalWidth = 1;
            let logicalHeight = 1;

            function add(a, b) {
                return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
            }

            function scale(v, amount) {
                return [v[0] * amount, v[1] * amount, v[2] * amount];
            }

            function dot(a, b) {
                return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
            }

            function snap(v) {
                return v.map((value) => {
                    const rounded = Math.round(value * 1000000) / 1000000;
                    return Math.abs(rounded) < 0.000001 ? 0 : rounded;
                });
            }

            function rotateAroundAxis(v, axis, angle) {
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                const axisDot = dot(axis, v);

                return [
                    v[0] * cos + (axis[1] * v[2] - axis[2] * v[1]) * sin + axis[0] * axisDot * (1 - cos),
                    v[1] * cos + (axis[2] * v[0] - axis[0] * v[2]) * sin + axis[1] * axisDot * (1 - cos),
                    v[2] * cos + (axis[0] * v[1] - axis[1] * v[0]) * sin + axis[2] * axisDot * (1 - cos)
                ];
            }

            function rotateX(v, angle) {
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);

                return [
                    v[0],
                    v[1] * cos - v[2] * sin,
                    v[1] * sin + v[2] * cos
                ];
            }

            function rotateY(v, angle) {
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);

                return [
                    v[0] * cos + v[2] * sin,
                    v[1],
                    -v[0] * sin + v[2] * cos
                ];
            }

            function transformForView(v) {
                return rotateX(rotateY(v, yaw), pitch);
            }

            function project(v) {
                const cameraDistance = 6;
                const zoom = Math.min(logicalWidth, logicalHeight) * 0.82;
                const factor = zoom / (cameraDistance - v[2]);

                return {
                    x: logicalWidth / 2 + v[0] * factor,
                    y: logicalHeight / 2 - v[1] * factor
                };
            }

            function easeInOut(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }

            function createSolvedCube() {
                stickers = [];

                for (const faceKey of faceOrder) {
                    const face = faces[faceKey];

                    for (let row = 0; row < 3; row += 1) {
                        for (let col = 0; col < 3; col += 1) {
                            const horizontal = (col - 1) * STICKER_STEP;
                            const vertical = (1 - row) * STICKER_STEP;
                            const center = add(
                                add(scale(face.normal, FACE_DISTANCE), scale(face.right, horizontal)),
                                scale(face.up, vertical)
                            );

                            stickers.push({
                                id: `${faceKey}-${row}-${col}`,
                                faceKey,
                                color: face.color,
                                center,
                                normal: [...face.normal],
                                right: [...face.right],
                                up: [...face.up]
                            });
                        }
                    }
                }
            }

            function turnToAngle(turn) {
                return turn === 2 ? Math.PI : turn * Math.PI / 2;
            }

            function turnLabel(turn) {
                if (turn === 1) return "counter-clockwise";
                if (turn === -1) return "clockwise";
                return "180 degrees";
            }

            function inverseTurn(turn) {
                return turn === 2 ? 2 : -turn;
            }

            function stickerCubieCenter(sticker) {
                return add(sticker.center, scale(sticker.normal, -0.5));
            }

            function selectedLayer(faceKey) {
                const face = faces[faceKey];
                return stickers.filter((sticker) => dot(stickerCubieCenter(sticker), face.normal) > 0.5);
            }

            function commitMove(move) {
                const face = faces[move.faceKey];
                const angle = turnToAngle(move.turn);

                for (const sticker of move.selected) {
                    sticker.center = snap(rotateAroundAxis(sticker.center, face.normal, angle));
                    sticker.normal = snap(rotateAroundAxis(sticker.normal, face.normal, angle));
                    sticker.right = snap(rotateAroundAxis(sticker.right, face.normal, angle));
                    sticker.up = snap(rotateAroundAxis(sticker.up, face.normal, angle));
                }
            }

            function enqueueMove(faceKey, turn, options = {}) {
                queue.push({
                    faceKey,
                    turn,
                    record: options.record !== false
                });

                if (!animation) startNextMove();
            }

            function startNextMove() {
                if (queue.length === 0) {
                    render();
                    return;
                }

                const nextMove = queue.shift();
                animation = {
                    ...nextMove,
                    selected: selectedLayer(nextMove.faceKey),
                    start: performance.now(),
                    duration: nextMove.turn === 2 ? HALF_MOVE_MS : MOVE_MS
                };

                requestAnimationFrame(render);
            }

            function finishAnimation() {
                const finished = animation;
                commitMove(finished);

                if (finished.record) {
                    moveHistory.push({ faceKey: finished.faceKey, turn: finished.turn });
                    updateHistory();
                }

                animation = null;
                startNextMove();
            }

            function stickerGeometry(sticker, extraAngle) {
                const face = animation ? faces[animation.faceKey] : null;
                let center = sticker.center;
                let normal = sticker.normal;
                let right = sticker.right;
                let up = sticker.up;

                if (face && extraAngle !== 0 && animation.selected.includes(sticker)) {
                    center = rotateAroundAxis(center, face.normal, extraAngle);
                    normal = rotateAroundAxis(normal, face.normal, extraAngle);
                    right = rotateAroundAxis(right, face.normal, extraAngle);
                    up = rotateAroundAxis(up, face.normal, extraAngle);
                }

                return { center, normal, right, up };
            }

            function pointsForSquare(geometry, halfSize) {
                const corners = [
                    add(add(geometry.center, scale(geometry.right, -halfSize)), scale(geometry.up, -halfSize)),
                    add(add(geometry.center, scale(geometry.right, halfSize)), scale(geometry.up, -halfSize)),
                    add(add(geometry.center, scale(geometry.right, halfSize)), scale(geometry.up, halfSize)),
                    add(add(geometry.center, scale(geometry.right, -halfSize)), scale(geometry.up, halfSize))
                ];
                const viewCorners = corners.map(transformForView);

                return {
                    points: viewCorners.map(project),
                    depth: viewCorners.reduce((sum, point) => sum + point[2], 0) / viewCorners.length
                };
            }

            function drawPolygon(points, color, strokeStyle = null, lineWidth = 0) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let index = 1; index < points.length; index += 1) {
                    ctx.lineTo(points[index].x, points[index].y);
                }
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();

                if (strokeStyle && lineWidth > 0) {
                    ctx.lineJoin = "round";
                    ctx.lineWidth = lineWidth;
                    ctx.strokeStyle = strokeStyle;
                    ctx.stroke();
                }
            }

            function drawCube(extraAngle) {
                const tiles = [];

                for (const sticker of stickers) {
                    const geometry = stickerGeometry(sticker, extraAngle);
                    const viewNormal = transformForView(geometry.normal);

                    if (viewNormal[2] <= 0.03) continue;

                    const plastic = pointsForSquare(geometry, PLASTIC_HALF);
                    const stickerFace = pointsForSquare(geometry, STICKER_HALF);

                    tiles.push({
                        depth: plastic.depth,
                        plasticPoints: plastic.points,
                        stickerPoints: stickerFace.points,
                        color: sticker.color,
                        strokeStyle: "#111315",
                        lineWidth: 1.5
                    });
                }

                tiles.sort((a, b) => a.depth - b.depth);

                for (const tile of tiles) {
                    drawPolygon(tile.plasticPoints, "#0b0e11");
                    drawPolygon(tile.stickerPoints, tile.color, tile.strokeStyle, tile.lineWidth);
                }
            }

            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                const nextWidth = Math.max(1, Math.round(rect.width * dpr));
                const nextHeight = Math.max(1, Math.round(rect.height * dpr));

                logicalWidth = rect.width;
                logicalHeight = rect.height;

                if (canvas.width !== nextWidth || canvas.height !== nextHeight) {
                    canvas.width = nextWidth;
                    canvas.height = nextHeight;
                }

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function render(now = performance.now()) {
                resizeCanvas();
                ctx.clearRect(0, 0, logicalWidth, logicalHeight);

                let extraAngle = 0;

                if (animation) {
                    const rawProgress = Math.min(1, (now - animation.start) / animation.duration);
                    extraAngle = turnToAngle(animation.turn) * easeInOut(rawProgress);

                    if (rawProgress >= 1) {
                        finishAnimation();
                        return;
                    }
                }

                ctx.save();
                ctx.shadowColor = "rgba(0, 0, 0, 0.32)";
                ctx.shadowBlur = 24;
                ctx.shadowOffsetY = 18;
                drawCube(extraAngle);
                ctx.restore();

                if (animation) requestAnimationFrame(render);
            }

            function arrowSymbol(kind) {
                if (kind === "ccw") {
                    return `<span class="turn-symbol" aria-hidden="true">↺</span>`;
                }

                if (kind === "cw") {
                    return `<span class="turn-symbol" aria-hidden="true">↻</span>`;
                }

                return `<span class="turn-symbol half" aria-hidden="true">180</span>`;
            }

            function makeMoveButton(faceKey, moveType) {
                const face = faces[faceKey];
                const button = document.createElement("button");
                button.className = "sticker-button";
                button.type = "button";
                button.title = `${face.label}, ${moveType.label}`;
                button.setAttribute("aria-label", `${face.label} face, ${moveType.label}`);
                button.style.setProperty("--face", face.color);
                button.style.setProperty("--ink", face.ink);
                button.innerHTML = `
                    <span class="sticker-face">
                        ${arrowSymbol(moveType.key)}
                    </span>
                `;
                button.addEventListener("click", () => enqueueMove(faceKey, moveType.turn));
                return button;
            }

            function buildMoveGrid() {
                moveGrid.textContent = "";

                for (const faceKey of faceOrder) {
                    const face = faces[faceKey];
                    const row = document.createElement("div");
                    row.className = "move-row";

                    const label = document.createElement("div");
                    label.className = "color-label";
                    label.innerHTML = `
                        <span class="swatch" style="--face: ${face.color}"></span>
                        <span>${face.label}</span>
                    `;

                    row.append(label);

                    for (const moveType of moveTypes) {
                        row.append(makeMoveButton(faceKey, moveType));
                    }

                    moveGrid.append(row);
                }
            }

            function updateHistory() {
                historyEl.textContent = "";

                if (moveHistory.length === 0) {
                    const empty = document.createElement("span");
                    empty.className = "empty-history";
                    empty.textContent = "No moves";
                    historyEl.append(empty);
                    return;
                }

                for (const move of moveHistory.slice(-48)) {
                    const face = faces[move.faceKey];
                    const chip = document.createElement("span");
                    chip.className = "history-chip";
                    chip.title = `${face.label}, ${turnLabel(move.turn)}`;
                    chip.setAttribute("aria-label", chip.title);
                    chip.innerHTML = `
                        <span class="swatch" style="--face: ${face.color}"></span>
                        ${arrowSymbol(move.turn === 1 ? "ccw" : move.turn === -1 ? "cw" : "half")}
                    `;
                    historyEl.append(chip);
                }
            }

            function resetCube() {
                queue = [];
                animation = null;
                moveHistory = [];
                createSolvedCube();
                updateHistory();
                render();
            }

            function scrambleCube() {
                if (animation || queue.length > 0) return;

                moveHistory = [];
                updateHistory();

                let previousFace = "";
                const turns = [-1, 1, 2];

                for (let index = 0; index < 22; index += 1) {
                    let faceKey = faceOrder[Math.floor(Math.random() * faceOrder.length)];
                    while (faceKey === previousFace) {
                        faceKey = faceOrder[Math.floor(Math.random() * faceOrder.length)];
                    }

                    previousFace = faceKey;
                    enqueueMove(faceKey, turns[Math.floor(Math.random() * turns.length)], {
                        record: true
                    });
                }
            }

            function undoMove() {
                if (animation || queue.length > 0 || moveHistory.length === 0) return;

                const lastMove = moveHistory.pop();
                updateHistory();
                enqueueMove(lastMove.faceKey, inverseTurn(lastMove.turn), {
                    record: false
                });
            }

            canvas.addEventListener("pointerdown", (event) => {
                dragging = true;
                lastPointer = { x: event.clientX, y: event.clientY };
                canvas.setPointerCapture(event.pointerId);
            });

            canvas.addEventListener("pointermove", (event) => {
                if (!dragging) return;

                const dx = event.clientX - lastPointer.x;
                const dy = event.clientY - lastPointer.y;
                lastPointer = { x: event.clientX, y: event.clientY };

                yaw += dx * 0.009;
                pitch += dy * 0.009;
                pitch = Math.max(-1.3, Math.min(1.3, pitch));
                render();
            });

            canvas.addEventListener("pointerup", (event) => {
                dragging = false;
                canvas.releasePointerCapture(event.pointerId);
            });

            canvas.addEventListener("pointercancel", () => {
                dragging = false;
            });

            scrambleButton.addEventListener("click", scrambleCube);
            resetButton.addEventListener("click", resetCube);
            undoButton.addEventListener("click", undoMove);
            window.addEventListener("resize", render);

            buildMoveGrid();
            resetCube();
        })();
    </script>
</body>
</html>
