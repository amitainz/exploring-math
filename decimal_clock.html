<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Fidelity Decimal Clock</title>
    <style>
        :root {
            --bg-color: #1a1b1e;
            --clock-bg: #25262b;
            --accent-u: #40c057; /* Green */
            --accent-t: #4dabf7; /* Blue */
            --accent-h: #fa5252; /* Red */
            --text-color: #c1c2c5;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-color);
            overflow: hidden; /* Prevent scroll on drag */
        }

        /* --- THE CLOCK --- */
        .clock-wrapper {
            position: relative;
            width: 360px;
            height: 360px;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
        }

        .clock-face {
            width: 100%;
            height: 100%;
            background: var(--clock-bg);
            border-radius: 50%;
            border: 8px solid #2c2e33;
            position: relative;
        }

        /* SVG Overlay for ticks/numbers */
        svg.dial {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        text {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            fill: #5c5f66;
            font-size: 24px;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        /* HANDS */
        .hand-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through container */
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: 50% 100%;
            border-radius: 100px;
            cursor: grab;
            pointer-events: auto; /* Re-enable clicks on hands */
            transition: filter 0.2s, transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
            z-index: 10;
        }

        .hand::before {
            /* Invisible hit area to make grabbing easier */
            content: '';
            position: absolute;
            left: -15px;
            right: -15px;
            top: -15px;
            bottom: -15px;
        }

        .hand:active, .hand.dragging {
            cursor: grabbing;
            filter: brightness(1.3);
            transition: none; /* Instant movement while dragging */
        }

        /* Hundreds (Red) - Short & Thick */
        #hand-h {
            width: 12px;
            height: 90px;
            background: var(--accent-h);
            margin-left: -6px;
            z-index: 2;
        }

        /* Tens (Blue) - Medium */
        #hand-t {
            width: 8px;
            height: 130px;
            background: var(--accent-t);
            margin-left: -4px;
            z-index: 3;
        }

        /* Units (Green) - Long & Thin */
        #hand-u {
            width: 4px;
            height: 160px;
            background: var(--accent-u);
            margin-left: -2px;
            z-index: 4;
        }

        .center-cap {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* --- CONTROLS --- */
        .controls {
            margin-top: 40px;
            text-align: center;
        }

        .readout-wrapper {
            position: relative;
            display: inline-block;
        }

        input#digital-readout {
            background: #141517;
            border: 2px solid #2c2e33;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 3rem;
            width: 200px;
            padding: 10px 20px;
            border-radius: 12px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        input#digital-readout:focus {
            border-color: var(--accent-t);
        }

        .legend {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

    </style>
</head>
<body>

    <div class="clock-wrapper" id="clock-area">
        <div class="clock-face">
            <svg class="dial" viewBox="0 0 360 360">
                </svg>

            <div class="hand-container">
                <div id="hand-h" class="hand" data-role="hundreds"></div>
                <div id="hand-t" class="hand" data-role="tens"></div>
                <div id="hand-u" class="hand" data-role="units"></div>
            </div>

            <div class="center-cap"></div>
        </div>
    </div>

    <div class="controls">
        <div class="readout-wrapper">
            <input type="number" id="digital-readout" value="0" min="0" max="999">
        </div>

        <div class="legend">
            <div class="legend-item" style="color: var(--accent-h)"><div class="dot" style="background:var(--accent-h)"></div>100s</div>
            <div class="legend-item" style="color: var(--accent-t)"><div class="dot" style="background:var(--accent-t)"></div>10s</div>
            <div class="legend-item" style="color: var(--accent-u)"><div class="dot" style="background:var(--accent-u)"></div>1s</div>
        </div>
        <p style="margin-top: 20px; color: #5c5f66; font-size: 0.8rem;">Drag hands to wind • Tap number to edit</p>
    </div>

    <script>
        // --- DRAWING THE DIAL (SVG) ---
        const svg = document.querySelector('.dial');
        const cx = 180, cy = 180, r = 160;

        function createTick(angle, isMajor, num) {
            const tick = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const length = isMajor ? 20 : 10;
            const width = isMajor ? 4 : 2;
            const color = isMajor ? "#5c5f66" : "#2c2e33";

            const rad = (angle - 90) * Math.PI / 180;
            const x1 = cx + (r - length) * Math.cos(rad);
            const y1 = cy + (r - length) * Math.sin(rad);
            const x2 = cx + r * Math.cos(rad);
            const y2 = cy + r * Math.sin(rad);

            tick.setAttribute("x1", x1);
            tick.setAttribute("y1", y1);
            tick.setAttribute("x2", x2);
            tick.setAttribute("y2", y2);
            tick.setAttribute("stroke", color);
            tick.setAttribute("stroke-width", width);
            tick.setAttribute("stroke-linecap", "round");
            svg.appendChild(tick);

            if (isMajor) {
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                // Position numbers slightly inward
                const tx = cx + (r - 40) * Math.cos(rad);
                const ty = cy + (r - 40) * Math.sin(rad);
                text.setAttribute("x", tx);
                text.setAttribute("y", ty + 2); // Visual tweak for vertical centering
                text.textContent = num;
                svg.appendChild(text);
            }
        }

        for (let i = 0; i < 100; i++) {
            const angle = i * 3.6;
            const isMajor = (i % 10 === 0);
            const num = i / 10;
            createTick(angle, isMajor, isMajor ? num : null);
        }

        // --- CLOCK LOGIC ---
        const state = {
            value: 0, // Float 0-1000
            max: 1000
        };

        const els = {
            h: document.getElementById('hand-h'),
            t: document.getElementById('hand-t'),
            u: document.getElementById('hand-u'),
            input: document.getElementById('digital-readout'),
            clockArea: document.getElementById('clock-area')
        };

        function updateView(animate = false) {
            // Clamp
            if (state.value < 0) state.value = 0;
            if (state.value >= state.max) state.value = state.max - 0.01;

            els.input.value = Math.round(state.value);

            // Calculate Angles
            // Units: 10 per 360deg
            const degU = (state.value % 10) / 10 * 360;
            // Tens: 100 per 360deg
            const degT = (state.value % 100) / 100 * 360;
            // Hundreds: 1000 per 360deg
            const degH = (state.value / 1000) * 360;

            const transformStyle = animate ? 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)' : 'none';

            if(animate) {
                [els.h, els.t, els.u].forEach(el => el.style.transition = transformStyle);
            }

            els.u.style.transform = `rotate(${degU}deg)`;
            els.t.style.transform = `rotate(${degT}deg)`;
            els.h.style.transform = `rotate(${degH}deg)`;
        }

        // --- INTERACTION ENGINE ---
        let drag = {
            active: false,
            hand: null,
            lastAngle: 0,
            startVal: 0
        };

        function getAngle(clientX, clientY) {
            const rect = els.clockArea.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = clientX - centerX;
            const dy = clientY - centerY;
            let deg = Math.atan2(dy, dx) * 180 / Math.PI;
            deg += 90; // normalize 0 to top
            return deg < 0 ? deg + 360 : deg;
        }

        function handleStart(e) {
            // Detect if clicking a hand
            const target = e.target.closest('.hand');
            if (!target) return;

            e.preventDefault(); // Stop scrolling on mobile

            drag.active = true;
            drag.hand = target.dataset.role;
            target.classList.add('dragging');

            // Disable transition for instant drag
            [els.h, els.t, els.u].forEach(el => el.style.transition = 'none');

            const point = e.touches ? e.touches[0] : e;
            drag.lastAngle = getAngle(point.clientX, point.clientY);
        }

        function handleMove(e) {
            if (!drag.active) return;
            e.preventDefault();

            const point = e.touches ? e.touches[0] : e;
            const currentAngle = getAngle(point.clientX, point.clientY);

            let delta = currentAngle - drag.lastAngle;
            // Normalize wrapping (crossing 12 o'clock)
            if (delta < -180) delta += 360;
            if (delta > 180) delta -= 360;

            // Sensitivity based on hand
            let multiplier = 0;
            if (drag.hand === 'units') multiplier = 10 / 360;     // 10 units per circle
            if (drag.hand === 'tens') multiplier = 100 / 360;     // 100 units per circle
            if (drag.hand === 'hundreds') multiplier = 1000 / 360; // 1000 units per circle

            state.value += delta * multiplier;
            drag.lastAngle = currentAngle;

            updateView(false); // No animation during drag
        }

        function handleEnd() {
            if (!drag.active) return;

            // Clean up
            document.querySelectorAll('.hand').forEach(h => h.classList.remove('dragging'));
            drag.active = false;
            drag.hand = null;

            // SNAP LOGIC: Round to nearest integer
            state.value = Math.round(state.value);
            updateView(true); // Animate the snap
        }

        // --- EVENT LISTENERS ---
        // Mouse
        document.addEventListener('mousedown', handleStart);
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd);

        // Touch (Mobile)
        document.addEventListener('touchstart', handleStart, {passive: false});
        document.addEventListener('touchmove', handleMove, {passive: false});
        document.addEventListener('touchend', handleEnd);

        // Input
        els.input.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if(isNaN(val)) val = 0;
            state.value = val;
            updateView(true);
        });

        // Allow Enter key
        els.input.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') els.input.blur();
        });

        // Init
        updateView(true);

    </script>
</body>
</html>
