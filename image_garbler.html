<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Matrix Garbler</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
        }
        .left-panel, .right-panel {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            min-width: 320px;
            overflow-y: auto;
        }
        .center-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: auto;
        }
        .canvas-container {
            position: relative;
            margin-top: 15px;
            display: inline-block;
        }
        canvas {
            border: 2px solid #333;
            cursor: crosshair;
            /* This forces the canvas to be large regardless of its internal pixel count */
            width: 500px;
            height: auto;
            /* These ensure the 10x10 pixels look like sharp squares, not a blur */
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
        .marker-fragment {
            position: absolute;
            border: 0px solid #000;
            pointer-events: none;
            display: none;
            box-sizing: border-box;
        }
        .matrix-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        .matrix {
            font-family: monospace;
            background: #222;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 11px;
            line-height: 1.4;
            letter-spacing: 1px;
            overflow-x: auto;
        }
        .matrix-r { color: #ff6b6b; border-left: 4px solid #ff6b6b; }
        .matrix-g { color: #51cf66; border-left: 4px solid #51cf66; }
        .matrix-b { color: #339af0; border-left: 4px solid #339af0; }
        textarea {
            width: 100%;
            height: 140px;
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
            background: #2d2d2d;
            color: #f8f8f2;
            border: 1px solid #444;
            border-radius: 4px;
            margin-bottom: 10px;
            resize: vertical;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        button:disabled {
            background-color: #888;
            cursor: not-allowed;
        }
        .controls { margin-bottom: 10px; text-align: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; width: 100%; }
        .code-header { font-family: monospace; font-weight: bold; margin-bottom: 5px; color: #333;}
        .logic-controls { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        progress { width: 100%; margin-bottom: 10px; height: 20px; display: none; }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="logic-controls">
            <button id="saveLogicBtn">Save Logic Pair</button>
            <input type="file" id="loadLogicLoader" accept=".json" style="display:none;">
            <button id="loadLogicBtn">Load Logic Pair</button>
            <label style="font-size: 14px; font-weight: bold;">Iterations:
                <input type="number" id="iterationsInput" value="101" min="1" style="width: 60px; padding: 5px;">
            </label>
        </div>

        <div class="code-header">function condition(x, y, iter) {</div>
        <textarea id="condCode" style="height: 60px;">
return (x + y) % 2 === iter % 2;
        </textarea>
        <div class="code-header">}</div>

        <div class="code-header">function processPixel(r, g, b) {</div>
        <textarea id="customCode">
let avgR = Math.floor((r[0][1] + r[2][1] + r[1][0] + r[1][2]) / 4);
let avgG = Math.floor((g[0][1] + g[2][1] + g[1][0] + g[1][2]) / 4);
let avgB = Math.floor((b[0][1] + b[2][1] + b[1][0] + b[1][2]) / 4);

let newR = (r[1][1] + avgR + 256) % 256;
let newG = (g[1][1] + avgG + 256) % 256;
let newB = (b[1][1] + avgB + 256) % 256;

return [newR, newG, newB];
        </textarea>
        <div class="code-header">}</div>

        <progress id="progressBar" value="0" max="100"></progress>
        <button id="applyBtn">Apply Logic</button>
        <button id="resetBtn">Reset Image</button>
    </div>

    <div class="center-panel">
        <div class="controls">
            <input type="file" id="imageLoader" accept="image/*"/>
            <button id="saveImageBtn">Save Image</button>
        </div>
        <div class="canvas-container">
            <div class="marker-fragment"></div>
            <div class="marker-fragment"></div>
            <div class="marker-fragment"></div>
            <div class="marker-fragment"></div>
            <canvas id="imageCanvas"></canvas>
        </div>
    </div>

    <div class="right-panel">
        <div class="matrix-container">
            <div id="matR" class="matrix matrix-r">Load image</div>
            <div id="matG" class="matrix matrix-g">Load image</div>
            <div id="matB" class="matrix matrix-b">Load image</div>
        </div>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const markerFragments = document.getElementsByClassName('marker-fragment');
        const ctx = canvas.getContext('2d');

        const applyBtn = document.getElementById('applyBtn');
        const resetBtn = document.getElementById('resetBtn');
        const saveImageBtn = document.getElementById('saveImageBtn');

        const saveLogicBtn = document.getElementById('saveLogicBtn');
        const loadLogicBtn = document.getElementById('loadLogicBtn');
        const loadLogicLoader = document.getElementById('loadLogicLoader');

        const customCodeInput = document.getElementById('customCode');
        const condCodeInput = document.getElementById('condCode');
        const iterationsInput = document.getElementById('iterationsInput');
        const progressBar = document.getElementById('progressBar');

        const matR = document.getElementById('matR');
        const matG = document.getElementById('matG');
        const matB = document.getElementById('matB');

        let originalImageData = null;
        let currentImageData = null;
        let currentImage = new Image();

        let markerX = -1;
        let markerY = -1;
        let isDragging = false;

        imageLoader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const objectURL = URL.createObjectURL(file);
            currentImage.onload = function() {
                canvas.width = currentImage.width;
                canvas.height = currentImage.height;
                ctx.drawImage(currentImage, 0, 0);

                originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                currentImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                markerX = Math.floor(canvas.width / 2);
                markerY = Math.floor(canvas.height / 2);
                updateInspectorAndMarker();

                URL.revokeObjectURL(objectURL);
            }
            currentImage.src = objectURL;
            e.target.value = '';
        });

        function getIdx(x, y, width) {
            return (y * width + x) * 4;
        }

        function formatMatrix(mat) {
            return mat.map(row =>
                row.map(val => String(val).padStart(3, '0')).join(' ')
            ).join('<br>');
        }

        function renderCanvas() {
            if (!currentImageData) return;
            ctx.putImageData(currentImageData, 0, 0);

            for (let f of markerFragments) f.style.display = 'none';

            if (markerX >= 0 && markerY >= 0) {
                const rect = canvas.getBoundingClientRect();
                const pSize = rect.width / canvas.width;
                const W = canvas.width;
                const H = canvas.height;

                const getRanges = (val, dim) => {
                    let start = val - 3, end = val + 3;
                    if (start < 0) return [[dim + start, dim - 1, true, false], [0, end, false, true]];
                    if (end >= dim) return [[start, dim - 1, true, false], [0, end - dim, false, true]];
                    return [[start, end, true, true]];
                };

                const xRanges = getRanges(markerX, W);
                const yRanges = getRanges(markerY, H);

                let fragIdx = 0;
                xRanges.forEach(([xS, xE, bL, bR]) => {
                    yRanges.forEach(([yS, yE, bT, bB]) => {
                        const f = markerFragments[fragIdx++];
                        if (!f) return;

                        f.style.display = 'block';
                        f.style.left = xS * pSize + 'px';
                        f.style.top = yS * pSize + 'px';
                        f.style.width = (xE - xS + 1) * pSize + 'px';
                        f.style.height = (yE - yS + 1) * pSize + 'px';

                        // Only draw borders on the "outer" limits of the 7x7 area
                        f.style.borderLeft = bL ? '3px solid #000' : 'none';
                        f.style.borderRight = bR ? '3px solid #000' : 'none';
                        f.style.borderTop = bT ? '3px solid #000' : 'none';
                        f.style.borderBottom = bB ? '3px solid #000' : 'none';
                    });
                });
            }
        }

        function updateInspectorAndMarker() {
            if (!currentImageData || markerX < 0 || markerY < 0) return;
            renderCanvas();

            const data = currentImageData.data;
            const w = canvas.width;
            const h = canvas.height;

            let r = Array.from({length: 7}, () => Array(7).fill(0));
            let g = Array.from({length: 7}, () => Array(7).fill(0));
            let b = Array.from({length: 7}, () => Array(7).fill(0));

            for (let dy = -3; dy <= 3; dy++) {
                for (let dx = -3; dx <= 3; dx++) {
                    let nx = (markerX + dx + w) % w;
                    let ny = (markerY + dy + h) % h;
                    let idx = getIdx(nx, ny, w);
                    r[dy+3][dx+3] = data[idx];
                    g[dy+3][dx+3] = data[idx+1];
                    b[dy+3][dx+3] = data[idx+2];
                }
            }

            matR.innerHTML = formatMatrix(r);
            matG.innerHTML = formatMatrix(g);
            matB.innerHTML = formatMatrix(b);
        }

        function updateMarkerPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            markerX = Math.floor((e.clientX - rect.left) * scaleX);
            markerY = Math.floor((e.clientY - rect.top) * scaleY);
            markerX = Math.max(0, Math.min(canvas.width - 1, markerX));
            markerY = Math.max(0, Math.min(canvas.height - 1, markerY));
            updateInspectorAndMarker();
        }

        canvas.addEventListener('mousedown', function(e) {
            if (!currentImageData) return;
            isDragging = true;
            updateMarkerPosition(e);
        });

        window.addEventListener('mousemove', function(e) {
            if (isDragging) updateMarkerPosition(e);
        });

        window.addEventListener('mouseup', function() {
            isDragging = false;
        });

        function resetUI() {
            applyBtn.innerText = "Apply Logic";
            applyBtn.disabled = false;
            progressBar.style.display = "none";
        }

        applyBtn.addEventListener('click', async function() {
            if (!currentImageData) return;

            let condFunc, userFunc;
            try {
                condFunc = new Function('x', 'y', 'iter', condCodeInput.value);
                userFunc = new Function('r', 'g', 'b', customCodeInput.value);
            } catch (err) {
                alert("Syntax Error:\n" + err.message);
                return;
            }

            const iterations = parseInt(iterationsInput.value, 10) || 1;
            const w = canvas.width;
            const h = canvas.height;

            progressBar.max = iterations;
            progressBar.value = 0;
            progressBar.style.display = "block";
            applyBtn.disabled = true;
            applyBtn.innerText = "Processing...";

            for (let iter = 0; iter < iterations; iter++) {
                const data = currentImageData.data;
                const outputData = new ImageData(new Uint8ClampedArray(data), w, h);
                const out = outputData.data;

                let r = Array.from({length: 3}, () => Array(3).fill(0));
                let g = Array.from({length: 3}, () => Array(3).fill(0));
                let b = Array.from({length: 3}, () => Array(3).fill(0));

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        let targetIdx = getIdx(x, y, w);

                        let applyTransform = false;
                        try {
                            applyTransform = condFunc(x, y, iter);
                        } catch (err) {
                            alert("Error in condition execution:\n" + err.message);
                            resetUI();
                            return;
                        }

                        if (!applyTransform) {
                            out[targetIdx] = data[targetIdx];
                            out[targetIdx+1] = data[targetIdx+1];
                            out[targetIdx+2] = data[targetIdx+2];
                            out[targetIdx+3] = data[targetIdx+3];
                            continue;
                        }

                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                let nx = (x + dx + w) % w;
                                let ny = (y + dy + h) % h;
                                let idx = getIdx(nx, ny, w);
                                r[dy+1][dx+1] = data[idx];
                                g[dy+1][dx+1] = data[idx+1];
                                b[dy+1][dx+1] = data[idx+2];
                            }
                        }

                        try {
                            const result = userFunc(r, g, b);
                            out[targetIdx] = result[0];
                            out[targetIdx+1] = result[1];
                            out[targetIdx+2] = result[2];
                            out[targetIdx+3] = data[targetIdx+3];
                        } catch (err) {
                            alert("Error in transformation execution:\n" + err.message);
                            resetUI();
                            return;
                        }
                    }
                }

                currentImageData = outputData;
                progressBar.value = iter + 1;

                await new Promise(resolve => setTimeout(resolve, 0));
            }

            updateInspectorAndMarker();
            resetUI();
        });

        resetBtn.addEventListener('click', function() {
            if (originalImageData) {
                currentImageData = new ImageData(
                    new Uint8ClampedArray(originalImageData.data),
                    canvas.width,
                    canvas.height
                );
                updateInspectorAndMarker();
            }
        });

        saveImageBtn.addEventListener('click', function() {
            if (!currentImageData) return;
            const filename = prompt("Enter filename:", "garbled_image");
            if (!filename) return;
            ctx.putImageData(currentImageData, 0, 0);
            const link = document.createElement('a');
            link.download = filename.endsWith('.png') ? filename : filename + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            updateInspectorAndMarker();
        });

        saveLogicBtn.addEventListener('click', function() {
            const filename = prompt("Enter filename:", "logic_pair");
            if (!filename) return;
            const logicObj = {
                condition: condCodeInput.value,
                transformation: customCodeInput.value
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(logicObj));
            const link = document.createElement('a');
            link.download = filename.endsWith('.json') ? filename : filename + '.json';
            link.href = dataStr;
            link.click();
        });

        loadLogicBtn.addEventListener('click', function() {
            loadLogicLoader.click();
        });

        loadLogicLoader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const logicObj = JSON.parse(event.target.result);
                    if (logicObj.condition !== undefined) condCodeInput.value = logicObj.condition;
                    if (logicObj.transformation !== undefined) customCodeInput.value = logicObj.transformation;
                } catch (err) {
                    alert("Invalid JSON file.");
                }
            };
            reader.readAsText(file);
            loadLogicLoader.value = "";
        });

    </script>
</body>
</html>
