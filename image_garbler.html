<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Garbler</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            margin-top: 20px;
            border: 2px dashed #ccc;
            max-width: 100%;
            height: auto;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>

    <h2>Local Image Garbler</h2>

    <div class="controls">
        <input type="file" id="imageLoader" accept="image/*"/>
        <button id="garbleBtn">Garble Image!</button>
    </div>

    <canvas id="imageCanvas"></canvas>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const garbleBtn = document.getElementById('garbleBtn');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        let currentImage = new Image();

        // 1. Handle the local file upload
        imageLoader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Create a temporary local URL for the selected file
            const objectURL = URL.createObjectURL(file);

            currentImage.onload = function() {
                // Resize canvas to match the image
                canvas.width = currentImage.width;
                canvas.height = currentImage.height;
                // Draw the original image
                ctx.drawImage(currentImage, 0, 0);

                // Free up memory once the image is loaded
                URL.revokeObjectURL(objectURL);
            }

            currentImage.src = objectURL;
        });

        // 2. Manipulate the pixels to "garble" the image
        garbleBtn.addEventListener('click', function() {
            if (canvas.width === 0) {
                alert("Please upload an image first!");
                return;
            }

            // Get the raw pixel data from the canvas
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // Loop through the pixels (each pixel has 4 values: Red, Green, Blue, Alpha)
            for (let i = 0; i < data.length; i += 4) {
                // Randomly mess with the colors to create a garbled/glitch effect
                if (Math.random() > 0.8) {
                    data[i] = 255 - data[i];         // Invert Red
                    data[i + 1] = Math.random() * 255; // Randomize Green
                    // Leave Blue (data[i+2]) and Alpha (data[i+3]) alone for this effect
                }

                // Optional: shift pixels horizontally slightly for a glitchy look
                if (Math.random() > 0.95 && i > 40) {
                    data[i] = data[i - 40];
                    data[i+1] = data[i - 39];
                    data[i+2] = data[i - 38];
                }
            }

            // Put the modified pixels back onto the canvas
            ctx.putImageData(imageData, 0, 0);
        });
    </script>

</body>
</html>
