<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; }
    #output {
      font-size: 3em;
      font-weight: bold;
      letter-spacing: 5px;
      min-height: 100px;
      border: 2px solid #333;
      padding: 20px;
      margin-top: 20px;
      text-align: left;
    }
    button { padding: 15px 30px; font-size: 1.2em; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    #status { margin-top: 10px; color: gray; }
  </style>
</head>
<body>

  <h2>Custom Sound-to-Letter Typist</h2>
  <p>Make sure to paste your Teachable Machine link into the code!</p>

  <button type="button" onclick="startTyping()">Start Listening</button>
  <div id="status">Waiting to start...</div>
  <div id="output"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

  <script type="text/javascript">
    // 🛑 PASTE YOUR EXPORTED TEACHABLE MACHINE LINK HERE:
    const URL = "https://teachablemachine.withgoogle.com/models/WVVCYRqN4/";

    let lastSpokenTime = 0;
    const cooldownMs = 800; // Waits 0.8 seconds before typing the next letter to prevent duplicates

    async function createModel() {
        const checkpointURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        const recognizer = speechCommands.create(
            "BROWSER_FFT", undefined, checkpointURL, metadataURL);

        await recognizer.ensureModelLoaded();
        return recognizer;
    }

    async function startTyping() {
        document.getElementById("status").innerText = "Loading model... Please wait.";
        const recognizer = await createModel();
        const classLabels = recognizer.wordLabels();

        document.getElementById("status").innerText = "Listening! Make your sounds.";

        recognizer.listen(result => {
            // Find the sound with the highest probability
            let maxScore = 0;
            let maxClass = "";

            for (let i = 0; i < classLabels.length; i++) {
                if (result.scores[i] > maxScore) {
                    maxScore = result.scores[i];
                    maxClass = classLabels[i];
                }
            }

            let currentTime = new Date().getTime();

            // If the AI is 85% sure, it's not background noise, and the cooldown has passed
            if (maxScore > 0.85 && maxClass !== "Background Noise" && (currentTime - lastSpokenTime > cooldownMs)) {

                // Append the letter to our output box
                document.getElementById("output").innerText += maxClass;
                lastSpokenTime = currentTime;

            }
        }, {
            includeSpectrogram: true,
            probabilityThreshold: 0.85, // How confident the AI needs to be
            invokeCallbackOnNoiseAndUnknown: true,
            overlapFactor: 0.50
        });
    }
  </script>

</body>
</html>
