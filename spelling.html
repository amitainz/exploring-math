<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sight Words Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Rock-Solid 3D Flip Card CSS */
        .flip-card {
            perspective: 1000px;
            touch-action: pan-y; /* Allows vertical scrolling but captures horizontal swipes */
            height: 80px; /* Fixed height for cards */
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Crucial for Safari */
            backface-visibility: hidden;
            border-radius: 1rem;
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }

        /* Prevent text highlighting when swiping/dragging */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 max-w-md w-full relative overflow-hidden">

        <div class="text-center mb-5">
            <h1 id="levelTitle" class="text-3xl font-extrabold text-slate-800 mb-2 tracking-tight transition-colors duration-300">Bronze Words</h1>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4 text-sm font-medium text-slate-600 bg-slate-50 py-3 px-4 rounded-xl border border-slate-100">
                <span class="flex items-center gap-1"><span class="text-xl">👆</span> Tap to Listen</span>
                <span class="hidden sm:inline text-slate-300">|</span>
                <span class="flex items-center gap-1"><span class="text-xl">↔️</span> Swipe to Reveal</span>
            </div>
        </div>

        <div class="mb-6">
            <label for="categorySelect" class="block text-sm font-semibold text-slate-500 mb-2 pl-1 uppercase tracking-wider">Select Level:</label>
            <select id="categorySelect" onchange="displayRandomWords()" class="w-full bg-slate-50 border-2 border-slate-200 text-slate-800 text-lg font-medium rounded-xl focus:ring-amber-500 focus:border-amber-500 block p-3 outline-none transition-all shadow-sm cursor-pointer appearance-none">
                <option value="Bronze">🥉 Bronze (48 words)</option>
                <option value="Silver">🥈 Silver (48 words)</option>
                <option value="Gold">🥇 Gold (60 words)</option>
                <option value="Platinum">💎 Platinum (70 words)</option>
                <option value="All">🌟 All Categories (226 words)</option>
            </select>
            <!-- Custom dropdown arrow -->
            <div class="pointer-events-none absolute right-10 top-[175px] sm:top-[160px] flex items-center px-2 text-slate-500">
                <svg class="fill-current h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
            </div>
        </div>

        <ul id="wordList" class="grid grid-cols-1 gap-4 mb-8">
            <!-- JavaScript will inject cards here -->
        </ul>

        <button
            id="shuffleBtn"
            onclick="displayRandomWords()"
            class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-6 rounded-2xl transition-all duration-200 shadow-md hover:shadow-lg active:scale-[0.98] flex items-center justify-center gap-2 text-lg"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Shuffle 10 Words
        </button>
    </div>

    <script>
        // Data containing all the words extracted from the image
        const wordsData = {
            Bronze: ["I", "am", "a", "in", "it", "is", "to", "put", "on", "of", "and", "no", "so", "go", "up", "the", "as", "can", "will", "he", "she", "we", "be", "me", "my", "his", "her", "see", "all", "fall", "call", "you", "for", "like", "come", "some", "they", "what", "old", "here", "said", "are", "look", "with", "do", "away", "went", "want"],
            Silver: ["going", "this", "out", "there", "where", "saw", "very", "have", "from", "could", "should", "would", "than", "then", "when", "after", "back", "little", "your", "down", "came", "were", "that", "them", "your", "water", "any", "made", "make", "Mr", "Mrs", "who", "looked", "ask", "their", "much", "these", "don't", "how", "now", "use", "many", "brother", "sister", "sure", "our", "try", "why"],
            Gold: ["one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "woke", "buy", "began", "does", "watch", "once", "great", "bought", "thought", "caught", "know", "knew", "being", "can't", "gone", "live", "love", "laugh", "change", "coming", "found", "sound", "didn't", "hear", "jumped", "called", "before", "high", "might", "year", "brought", "opened", "started", "stopped", "people", "leave", "show", "mother", "father", "told", "tries", "think", "talk", "walk", "almost", "always", "never", "also", "used", "turn"],
            Platinum: ["turned", "woken", "walked", "show", "write", "better", "often", "first", "second", "third", "walking", "still", "during", "every", "half", "those", "while", "until", "today", "only", "outside", "inside", "around", "under", "below", "between", "along", "upon", "across", "near", "number", "different", "also", "small", "paper", "other", "place", "great", "children", "clothes", "young", "suddenly", "both", "year", "birthday", "together", "without", "garden", "through", "such", "own", "eyes", "friend", "earth", "world", "work", "morning", "money", "sometimes", "something", "small", "whole", "head", "heard", "white", "window", "sound", "word", "animal", "light"]
        };

        // Theme colors for UI updates based on selection
        const themes = {
            Bronze: { text: 'text-amber-700', bg: 'bg-amber-50', border: 'border-amber-200', btn: 'bg-amber-600 hover:bg-amber-700' },
            Silver: { text: 'text-slate-500', bg: 'bg-slate-100', border: 'border-slate-300', btn: 'bg-slate-500 hover:bg-slate-600' },
            Gold: { text: 'text-yellow-600', bg: 'bg-yellow-50', border: 'border-yellow-200', btn: 'bg-yellow-500 hover:bg-yellow-600' },
            Platinum: { text: 'text-cyan-600', bg: 'bg-cyan-50', border: 'border-cyan-200', btn: 'bg-cyan-600 hover:bg-cyan-700' },
            All: { text: 'text-indigo-600', bg: 'bg-indigo-50', border: 'border-indigo-200', btn: 'bg-indigo-600 hover:bg-indigo-700' }
        };

        // Trigger voices to load early
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }

        function speakWord(word) {
            if (!('speechSynthesis' in window)) {
                console.warn("Text-to-speech is not supported in this browser/environment.");
                return;
            }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            const voices = window.speechSynthesis.getVoices();

            const ukVoice = voices.find(voice =>
                voice.lang === 'en-GB' || voice.name.includes('UK') || voice.name.includes('Great Britain')
            );

            if (ukVoice) {
                utterance.voice = ukVoice;
            } else {
                utterance.lang = 'en-GB';
            }

            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }

        function createCard(word, theme) {
            const li = document.createElement('li');
            li.className = 'flip-card w-full no-select cursor-pointer';

            li.innerHTML = `
                <div class="flip-card-inner shadow-sm hover:shadow-md">
                    <!-- FRONT OF CARD (Hidden State) -->
                    <div class="flip-card-front ${theme.bg} border-2 ${theme.border} flex items-center justify-between px-6 transition-colors">
                        <div class="flex items-center gap-3 ${theme.text}">
                            <div class="bg-white/50 p-2 rounded-full backdrop-blur-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                </svg>
                            </div>
                            <span class="font-semibold text-lg">Listen</span>
                        </div>
                        <div class="${theme.text} opacity-40">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                            </svg>
                        </div>
                    </div>

                    <!-- BACK OF CARD (Revealed State) -->
                    <div class="flip-card-back bg-green-50 border-2 border-green-400 flex items-center justify-center shadow-inner">
                        <span class="text-3xl font-bold text-green-800 tracking-wide">${word}</span>
                    </div>
                </div>
            `;

            let startX, startY;
            let isSwiping = false;

            li.addEventListener('pointerdown', (e) => {
                startX = e.clientX;
                startY = e.clientY;
                isSwiping = false;
            });

            li.addEventListener('pointermove', (e) => {
                if (startX === undefined) return;
                let diffX = e.clientX - startX;
                let diffY = e.clientY - startY;
                if (Math.abs(diffX) > 15 || Math.abs(diffY) > 15) isSwiping = true;
            });

            li.addEventListener('pointerup', (e) => {
                if (startX === undefined) return;
                let diffX = e.clientX - startX;

                if (isSwiping) {
                    if (Math.abs(diffX) > 40) li.classList.toggle('flipped');
                } else {
                    speakWord(word);
                }

                startX = undefined;
                startY = undefined;
            });

            li.addEventListener('pointerleave', () => {
                startX = undefined;
                startY = undefined;
            });

            return li;
        }

        function displayRandomWords() {
            const category = document.getElementById('categorySelect').value;
            const titleEl = document.getElementById('levelTitle');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const theme = themes[category];

            // Update UI Theme
            titleEl.textContent = category === 'All' ? 'All Words' : category + ' Words';
            titleEl.className = `text-3xl font-extrabold mb-2 tracking-tight transition-colors duration-300 ${theme.text}`;
            shuffleBtn.className = `w-full text-white font-bold py-4 px-6 rounded-2xl transition-all duration-200 shadow-md hover:shadow-lg active:scale-[0.98] flex items-center justify-center gap-2 text-lg ${theme.btn}`;

            // Get words pool
            let currentWords = [];
            if (category === 'All') {
                currentWords = [...wordsData.Bronze, ...wordsData.Silver, ...wordsData.Gold, ...wordsData.Platinum];
            } else {
                currentWords = [...wordsData[category]];
            }

            // Shuffle array using Fisher-Yates
            for (let i = currentWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentWords[i], currentWords[j]] = [currentWords[j], currentWords[i]];
            }

            // Limit to 10
            const selectedWords = currentWords.slice(0, 10);

            const listElement = document.getElementById('wordList');
            listElement.innerHTML = '';

            selectedWords.forEach((word, index) => {
                const card = createCard(word, theme);
                card.style.animation = `fadeIn 0.4s ease forwards ${index * 0.05}s`;
                card.style.opacity = '0';
                listElement.appendChild(card);
            });
        }

        // Init on load
        window.onload = displayRandomWords;
    </script>
</body>
</html>
