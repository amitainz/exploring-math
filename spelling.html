<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bronze Words Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        /* Rock-Solid 3D Flip Card CSS */
        .flip-card {
            perspective: 1000px;
            touch-action: pan-y; /* Allows vertical scrolling but captures horizontal swipes */
            height: 80px; /* Fixed height for cards */
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Crucial for Safari */
            backface-visibility: hidden;
            border-radius: 1rem;
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }

        /* Prevent text highlighting when swiping/dragging */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 max-w-md w-full relative overflow-hidden">

        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-amber-700 mb-2 tracking-tight">Listen & Spell</h1>
            <div class="flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-4 text-sm font-medium text-slate-600 bg-slate-50 py-3 px-4 rounded-xl border border-slate-100">
                <span class="flex items-center gap-1"><span class="text-xl">👆</span> Tap to Listen</span>
                <span class="hidden sm:inline text-slate-300">|</span>
                <span class="flex items-center gap-1"><span class="text-xl">↔️</span> Swipe to Reveal</span>
            </div>
        </div>

        <ul id="wordList" class="grid grid-cols-1 gap-4 mb-8">
            <!-- JavaScript will inject cards here -->
        </ul>

        <button
            onclick="displayRandomWords()"
            class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 px-6 rounded-2xl transition-all duration-200 shadow-md hover:shadow-lg active:scale-[0.98] flex items-center justify-center gap-2 text-lg"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Shuffle New Words
        </button>
    </div>

    <div id="spellingModal" class="hidden fixed inset-0 bg-slate-900/95 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-4xl shadow-2xl flex flex-col items-center">
            <div class="w-full flex justify-between items-center mb-6">
                <div class="flex items-center gap-3">
                    <h2 class="text-2xl font-bold text-slate-700">Spell the word:</h2>
                    <button onclick="speakWord(currentTargetWord)" class="bg-amber-100 hover:bg-amber-200 p-2 rounded-full text-xl" title="Listen Again">🔊</button>
                </div>
                <button onclick="closeSpelling()" class="text-slate-400 hover:text-red-500 font-bold text-3xl leading-none">&times;</button>
            </div>
            <p class="text-sm text-slate-500 mb-4">Write one CAPITAL letter per box.</p>
            <div class="w-full overflow-x-auto pb-4 mb-4 flex justify-start sm:justify-center">
                <div id="boxContainer" class="flex gap-2 min-w-max px-2">
                </div>
            </div>
            <div id="spellingResult" class="text-center mb-6 text-3xl font-black h-10 w-full"></div>
            <div class="flex justify-center gap-4 w-full flex-wrap">
                <button onclick="clearAllBoxes()" class="bg-slate-200 hover:bg-slate-300 px-6 py-4 rounded-xl font-bold text-slate-700">Clear All</button>
                <button id="checkBtn" onclick="checkSpelling()" class="bg-green-600 hover:bg-green-500 text-white px-8 py-4 rounded-xl font-bold text-xl shadow-lg">Check Spelling</button>
            </div>
        </div>
    </div>

    <script>
        // The complete list of 56 Bronze words
        const allWords = [
            "I", "am", "a", "in", "it", "is", "to", "put",
            "on", "of", "and", "no", "so", "go", "up", "the",
            "as", "can", "will", "he", "she", "we", "be", "me",
            "my", "his", "her", "see", "all", "fall", "call", "you",
            "for", "like", "come", "some", "they", "what", "old", "here",
            "said", "are", "look", "with", "do", "away", "went", "want",
            "going", "this", "out", "there", "where", "saw", "very", "have"
        ];

        // Voice hints ordered by clarity preference (British first).
        const preferredVoicePatterns = [
            /google uk english female/i,
            /google uk english male/i,
            /libby.*english \(united kingdom\)/i,
            /ryan.*english \(united kingdom\)/i,
            /sonia.*english \(united kingdom\)/i,
            /hazel/i,
            /daniel/i,
            /arthur/i
        ];

        let cachedVoices = [];
        let preferredVoice = null;

        function scoreVoice(voice) {
            const lang = (voice.lang || '').toLowerCase();
            const name = (voice.name || '').toLowerCase();
            let score = 0;

            if (lang === 'en-gb') score += 120;
            else if (lang.startsWith('en-gb')) score += 110;
            else if (lang === 'en-ie' || lang === 'en-au' || lang === 'en-nz') score += 80;
            else if (lang.startsWith('en-')) score += 60;

            preferredVoicePatterns.forEach((pattern, index) => {
                if (pattern.test(name)) {
                    score += 70 - index * 3;
                }
            });

            if (/natural|neural|enhanced|premium|online/.test(name)) score += 20;
            if (/compact|legacy/.test(name)) score -= 10;
            if (!voice.localService) score += 5;

            return score;
        }

        function choosePreferredVoice(voices) {
            if (!voices.length) return null;

            const englishVoices = voices.filter(voice => /^en(-|$)/i.test(voice.lang || ''));
            const pool = englishVoices.length ? englishVoices : voices;

            return pool
                .map(voice => ({ voice, score: scoreVoice(voice) }))
                .sort((a, b) => b.score - a.score)[0]?.voice || null;
        }

        function refreshVoices() {
            if (!('speechSynthesis' in window)) return;
            cachedVoices = window.speechSynthesis.getVoices();
            preferredVoice = choosePreferredVoice(cachedVoices);
        }

        // Trigger voices to load early and also after async voice initialization.
        if ('speechSynthesis' in window) {
            refreshVoices();
            window.speechSynthesis.onvoiceschanged = refreshVoices;
        }

        function speakWord(word) {
            if (!('speechSynthesis' in window)) {
                console.warn("Text-to-speech is not supported in this browser/environment.");
                return;
            }

            // Cancel any current speech to prevent overlapping
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(word);
            if (!cachedVoices.length) {
                refreshVoices();
            }

            if (preferredVoice) {
                utterance.voice = preferredVoice;
                utterance.lang = preferredVoice.lang || 'en-GB';
            } else {
                utterance.lang = 'en-GB'; // Fallback to British English when no voice metadata exists
            }

            // Keep speech clear without sounding slurred.
            utterance.rate = 0.92;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function createCard(word) {
            const li = document.createElement('li');
            li.className = 'flip-card w-full no-select cursor-pointer';

            li.innerHTML = `
                <div class="flip-card-inner shadow-sm hover:shadow-md">
                    <!-- FRONT OF CARD (Hidden State) -->
                    <div class="flip-card-front bg-amber-50 border-2 border-amber-200 flex items-center justify-between px-6 transition-colors">
                        <div class="flex items-center gap-3 text-amber-800">
                            <div class="bg-amber-200 p-2 rounded-full">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                </svg>
                            </div>
                            <span class="font-semibold text-lg">Listen</span>
                        </div>
                        <button class="spell-btn bg-amber-200 hover:bg-amber-300 text-2xl p-2 rounded-full shadow-sm active:scale-90" aria-label="Spell Word">✏️</button>
                    </div>

                    <!-- BACK OF CARD (Revealed State) -->
                    <div class="flip-card-back bg-green-50 border-2 border-green-400 flex items-center justify-center shadow-inner">
                    <div class="flip-card-back bg-green-50 border-2 border-green-400 flex items-center justify-between px-4 shadow-inner">
                        <div class="w-10"></div>
                        <span class="text-3xl font-bold text-green-800 tracking-wide">${word}</span>
                        <div class="w-10"></div>
                    </div>
                </div>
            `;

            // Gesture logic using pointer events (Works for both Mouse and Touch)
            let startX, startY;
            let isSwiping = false;

            li.addEventListener('pointerdown', (e) => {
                startX = e.clientX;
                startY = e.clientY;
                isSwiping = false;
            });

            li.addEventListener('pointermove', (e) => {
                if (startX === undefined) return; // Not holding down

                let diffX = e.clientX - startX;
                let diffY = e.clientY - startY;

                // If they move more than 15 pixels, count it as a swipe/drag
                if (Math.abs(diffX) > 15 || Math.abs(diffY) > 15) {
                    isSwiping = true;
                }
            });

            li.addEventListener('pointerup', (e) => {
                if (startX === undefined) return;

                let diffX = e.clientX - startX;

                if (isSwiping) {
                    // Check if horizontal swipe distance is long enough
                    if (Math.abs(diffX) > 40) {
                        li.classList.toggle('flipped'); // Reveal or hide
                    }
                } else {
                    // It was just a tap/click
                    speakWord(word);
                }

                // Reset
                startX = undefined;
                startY = undefined;
            });

            // Prevent drag from breaking if mouse leaves element
            li.addEventListener('pointerleave', () => {
                startX = undefined;
                startY = undefined;
            });

            // Prevent swipe/tap logic when clicking the spelling button
            const spellBtn = li.querySelector('.spell-btn');
            spellBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
            spellBtn.addEventListener('pointerup', (e) => {
                e.stopPropagation();
                openSpelling(word);
            });

            return li;
        }

        function displayRandomWords() {
            // Shuffle array using Fisher-Yates
            let shuffled = [...allWords];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            // Get 10 words
            const selectedWords = shuffled.slice(0, 10);

            const listElement = document.getElementById('wordList');
            listElement.innerHTML = '';

            selectedWords.forEach((word, index) => {
                const card = createCard(word);
                // Staggered fade in animation
                card.style.animation = `fadeIn 0.4s ease forwards ${index * 0.05}s`;
                card.style.opacity = '0';
                listElement.appendChild(card);
            });
        }

        // ==========================================
        // HANDWRITING SPELLING LOGIC
        // ==========================================
        let currentTargetWord = "";
        const TOTAL_BOXES = 10;
        let canvases = [];
        let contexts = [];

        function initBoxes() {
            const container = document.getElementById('boxContainer');
            container.innerHTML = '';
            canvases = []; contexts = [];

            for (let i = 0; i < TOTAL_BOXES; i++) {
                const wrap = document.createElement('div');
                wrap.className = 'border-4 border-slate-300 bg-slate-50 rounded-xl overflow-hidden shadow-inner flex-shrink-0';
                
                const c = document.createElement('canvas');
                c.width = 60; c.height = 80; 
                c.className = 'touch-none cursor-crosshair block';
                c.dataset.hasStrokes = 'false';

                const ctx = c.getContext('2d');
                // Fill canvas with white so the AI can actually "see" the ink
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, c.width, c.height);

                ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = '#1e293b';

                let isDrawing = false;
                c.onpointerdown = (e) => {
                    isDrawing = true; c.dataset.hasStrokes = 'true';
                    const rect = c.getBoundingClientRect();
                    ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
                };
                c.onpointermove = (e) => {
                    if (!isDrawing) return;
                    const rect = c.getBoundingClientRect();
                    ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top); ctx.stroke();
                };
                c.onpointerup = () => isDrawing = false;
                c.onpointerleave = () => isDrawing = false;

                wrap.appendChild(c); container.appendChild(wrap);
                canvases.push(c); contexts.push(ctx);
            }
        }

        function openSpelling(word) {
            currentTargetWord = word;
            document.getElementById('spellingModal').classList.remove('hidden');
            document.getElementById('spellingResult').innerText = "";
            initBoxes();
        }

        function closeSpelling() { document.getElementById('spellingModal').classList.add('hidden'); }

        function clearAllBoxes() {
            canvases.forEach((c, i) => { 
                contexts[i].clearRect(0, 0, c.width, c.height); 
                contexts[i].fillStyle = '#ffffff';
                contexts[i].fillRect(0, 0, c.width, c.height);
                c.dataset.hasStrokes = 'false'; 
            });
            document.getElementById('spellingResult').innerText = "";
        }

        async function checkSpelling() {
            const checkBtn = document.getElementById('checkBtn');
            const resultDiv = document.getElementById('spellingResult');
            checkBtn.innerText = "Checking..."; checkBtn.disabled = true; resultDiv.innerText = "";

            try {
                const promises = canvases.map(c => {
                    if (c.dataset.hasStrokes === 'true') {
                        return Tesseract.recognize(c, 'eng', {
                            tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                            tessedit_pageseg_mode: '10' // 10 = Treat as single character
                        }).then(res => res.data.text.trim().toUpperCase());
                    }
                    return Promise.resolve('');
                });

                const letters = await Promise.all(promises);
                
                let isCorrect = true;
                const displaySlots = [];
                const targetUpper = currentTargetWord.toUpperCase();

                // STRICT POSITIONAL CHECKING
                for (let i = 0; i < TOTAL_BOXES; i++) {
                    const char = letters[i].replace(/[^A-Z]/g, '').charAt(0) || "";
                    const hasStrokes = canvases[i]?.dataset.hasStrokes === 'true';
                    displaySlots.push(char || (hasStrokes ? "?" : "_"));
                    
                    if (i < targetUpper.length) {
                        // Inside the word: Check if the letter matches the box position
                        if (char !== targetUpper[i]) isCorrect = false;
                    } else {
                        // Outside the word: any stroke is an extra letter attempt
                        if (hasStrokes) {
                            isCorrect = false;
                        }
                    }
                }

                if (isCorrect) {
                    resultDiv.innerText = "🎉 CORRECT! 🎉"; resultDiv.className = "text-green-500 mb-6 text-3xl font-black h-10 w-full animate-bounce";
                } else {
                    resultDiv.innerText = `You wrote: ${displaySlots.join(" ")} ❌`; resultDiv.className = "text-red-500 mb-6 text-3xl font-black h-10 w-full tracking-[0.5em]";
                }
            } catch (err) {
                resultDiv.innerText = "Error reading letters.";
            } finally {
                checkBtn.innerText = "Check Spelling"; checkBtn.disabled = false;
            }
        }

        // Init on load
        window.onload = displayRandomWords;
    </script>
</body>
</html>
