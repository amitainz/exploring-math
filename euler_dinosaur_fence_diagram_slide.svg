  <circle class="post" cx="390" cy="468" r="13"/>

  <g opacity=".9">
    <use href="#dinosaur" transform="translate(320 350) scale(.58)"/>
    <use href="#dinosaur" transform="translate(405 418) scale(.32)"/>
    <use href="#dinosaur" transform="translate(585 170) scale(.52)"/>
    <use href="#dinosaur" transform="translate(800 220) scale(.42)"/>
    <use href="#dinosaur" transform="translate(785 400) scale(.54)"/>
  </g>

  <path class="callout" d="M258 292 C267 311 278 325 288 334"/>
  <rect x="150" y="250" width="206" height="39" rx="8" fill="#fffdf8" stroke="#d1d7df" stroke-width="1.5"/>
  <text class="tag" x="170" y="276">one safe region</text>

  <path class="callout" d="M665 50 L665 92"/>
  <rect x="585" y="8" width="164" height="39" rx="8" fill="#fffdf8" stroke="#d1d7df" stroke-width="1.5"/>
  <text class="tag" x="606" y="34">fence segment</text>

  <path class="callout" d="M315 135 C300 145 281 157 262 168"/>
  <rect x="314" y="104" width="92" height="39" rx="8" fill="#fffdf8" stroke="#d1d7df" stroke-width="1.5"/>
  <text class="tag" x="339" y="130">post</text>
