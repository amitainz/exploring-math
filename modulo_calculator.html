<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo Calculator Factory</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #input-container {
            margin-bottom: 20px;
            z-index: 10;
        }

        input[type="text"] {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 25px;
            width: 300px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
        }

        #canvas-container {
            position: relative;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 20px;
        }

        svg {
            display: block;
            overflow: visible;
        }

        .label-text {
            font-size: 14px;
            font-weight: bold;
            fill: #555;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .index-text {
            font-size: 12px;
            font-weight: bold;
            fill: #999;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .tick-line { stroke: #ddd; stroke-width: 2; }
        .tick-text { font-size: 12px; fill: #ccc; text-anchor: middle; }

        /* Interactive Elements */
        .grab-handle { cursor: grab; }
        .grab-handle:active { cursor: grabbing; }

        #vector-path {
            fill: none;
            stroke: rgba(74, 144, 226, 0.6);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        #vector-path.negative {
            stroke: rgba(226, 74, 74, 0.6);
        }

        .point-marker {
            fill: #eee;
            stroke: none;
        }
    </style>
</head>
<body>

    <h1>Modulo Factory</h1>

    <div id="input-container">
        <input type="text" id="labels-input" value="0, 1, 2, 3, 4, 5, 6, 7" placeholder="Type labels (e.g. A, B, C)">
    </div>

    <div id="canvas-container">
        <svg id="main-svg" width="500" height="600">
            <g id="circle-group" transform="translate(250, 220)">
                <circle cx="0" cy="0" r="160" fill="none" stroke="#eee" stroke-width="2" />
                <g id="points-group"></g>

                <path id="vector-path" d="" />

                <circle id="base-handle" r="10" fill="#4a90e2" stroke="white" stroke-width="2" class="grab-handle" />
                <g id="tip-group" class="grab-handle">
                    <polygon id="tip-arrow" points="-10,-10 15,0 -10,10" fill="#4a90e2" stroke="white" stroke-width="2" />
                </g>
            </g>

            <g id="slider-group" transform="translate(50, 520)">
                <line x1="0" y1="0" x2="400" y2="0" stroke="#ccc" stroke-width="4" stroke-linecap="round" />
                <g id="slider-ticks"></g>

                <line id="slider-vector-line" x1="200" y1="0" x2="200" y2="0" stroke="#4a90e2" stroke-width="6" />
                <circle id="slider-zero-dot" cx="200" cy="0" r="5" fill="#4a90e2" />

                <g id="slider-handle-group" class="grab-handle" transform="translate(200, 0)">
                    <polygon id="slider-arrowhead" points="-2,-6 12,0 -2,6" fill="#4a90e2" />

                    <polygon id="slider-caret" points="-8,22 8,22 0,8" fill="#222" />

                    <text id="slider-value-text" x="0" y="38" font-size="14" font-weight="bold" fill="black" text-anchor="middle">+0</text>
                </g>
            </g>
        </svg>
    </div>

<script>
    // --- State ---
    let labels = [];
    let n = 0;
    let vectorValue = 2;
    let baseIndex = 0;

    // --- Configuration ---
    const circleRadius = 140;
    const sliderWidth = 400;
    const sliderCenter = 200;
    const sliderRange = 10;
    const sliderStepPx = sliderWidth / (sliderRange * 2);

    // --- DOM Elements ---
    const inputEl = document.getElementById('labels-input');
    const pointsGroup = document.getElementById('points-group');
    const vectorPath = document.getElementById('vector-path');
    const baseHandle = document.getElementById('base-handle');
    const tipGroup = document.getElementById('tip-group');
    const tipArrow = document.getElementById('tip-arrow');
    const sliderTicksGroup = document.getElementById('slider-ticks');

    // New Slider Elements
    const sliderHandleGroup = document.getElementById('slider-handle-group');
    const sliderVectorLine = document.getElementById('slider-vector-line');
    const sliderZeroDot = document.getElementById('slider-zero-dot');
    const sliderArrowhead = document.getElementById('slider-arrowhead');
    const sliderValueText = document.getElementById('slider-value-text');

    const svgEl = document.getElementById('main-svg');

    // --- Helpers ---
    function mod(a, n) {
        return ((a % n) + n) % n;
    }

    function getCoords(index, radius) {
        const angle = -Math.PI / 2 + (index * (2 * Math.PI) / n);
        return {
            x: radius * Math.cos(angle),
            y: radius * Math.sin(angle),
            angle: angle
        };
    }

    // --- Initialization ---
    function parseInput() {
        const raw = inputEl.value;
        if (!raw.trim()) {
            labels = ['0', '1', '2', '3', '4'];
        } else {
            labels = raw.split(',').map(s => s.trim()).filter(s => s.length > 0);
        }
        n = labels.length;
        if (n === 0) {
            labels = ['0'];
            n = 1;
        }
        renderPoints();
        updateVisuals();
    }

    function renderPoints() {
        pointsGroup.innerHTML = '';
        labels.forEach((label, i) => {
            const coords = getCoords(i, circleRadius);

            // Point
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", coords.x);
            circle.setAttribute("cy", coords.y);
            circle.setAttribute("r", 4);
            circle.setAttribute("class", "point-marker");
            pointsGroup.appendChild(circle);

            // Inner Label (Index 0..n-1)
            const innerCoords = getCoords(i, circleRadius - 25);
            const innerText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            innerText.setAttribute("x", innerCoords.x);
            innerText.setAttribute("y", innerCoords.y);
            innerText.setAttribute("class", "index-text");
            innerText.textContent = i;
            pointsGroup.appendChild(innerText);

            // Outer Label (User Input)
            const outerCoords = getCoords(i, circleRadius + 25);
            const outerText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            outerText.setAttribute("x", outerCoords.x);
            outerText.setAttribute("y", outerCoords.y);
            outerText.setAttribute("class", "label-text");
            outerText.textContent = label;
            pointsGroup.appendChild(outerText);
        });
    }

    function renderSliderTicks() {
        sliderTicksGroup.innerHTML = '';
        for(let i = -sliderRange; i <= sliderRange; i++) {
            if(i === 0) continue;
            const x = sliderCenter + (i * sliderStepPx);

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x);
            line.setAttribute("y1", -5);
            line.setAttribute("x2", x);
            line.setAttribute("y2", 5);
            line.setAttribute("class", "tick-line");

            // Tick Numbers
            if (Math.abs(i) % 5 === 0 || Math.abs(i) === sliderRange) {
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", x);
                text.setAttribute("y", 20);
                text.setAttribute("class", "tick-text");
                text.textContent = i;
                sliderTicksGroup.appendChild(text);
            }
            sliderTicksGroup.appendChild(line);
        }
    }

    // --- Rendering Logic ---
    function updateVisuals() {
        const color = vectorValue < 0 ? "#e24a4a" : "#4a90e2";
        const isNeg = vectorValue < 0;

        // 1. Slider UI
        const sliderX = sliderCenter + (vectorValue * sliderStepPx);

        // Move Group
        sliderHandleGroup.setAttribute("transform", `translate(${sliderX}, 0)`);

        // Update Line
        sliderVectorLine.setAttribute("x2", sliderX);
        sliderVectorLine.setAttribute("stroke", color);

        // Update Dot & Arrowhead Color
        sliderZeroDot.setAttribute("fill", color);
        sliderArrowhead.setAttribute("fill", color);

        // Flip Arrowhead if negative
        // Note: The polygon points Right. If negative, we want it pointing Left.
        sliderArrowhead.setAttribute("transform", isNeg ? "scale(-1, 1)" : "");

        // Update Text
        const dispVal = Math.round(vectorValue);
        const sign = dispVal > 0 ? "+" : ""; // Show + for positive, minus comes automatically
        sliderValueText.textContent = sign + dispVal;

        // Circle Colors
        baseHandle.setAttribute("fill", color);
        tipArrow.setAttribute("fill", color);
        if(isNeg) vectorPath.classList.add('negative');
        else vectorPath.classList.remove('negative');

        // 2. Circular Base
        const baseCoords = getCoords(baseIndex, circleRadius);
        baseHandle.setAttribute("cx", baseCoords.x);
        baseHandle.setAttribute("cy", baseCoords.y);

        // 3. Circular Tip
        const tipVal = mod(baseIndex + vectorValue, n);
        const tipCoords = getCoords(tipVal, circleRadius);
        tipGroup.setAttribute("transform", `translate(${tipCoords.x}, ${tipCoords.y})`);

        const tangentAngle = (tipCoords.angle * 180 / Math.PI) + 90 + (isNeg ? 180 : 0);
        tipArrow.setAttribute("transform", `rotate(${tangentAngle})`);

        // 4. Spiral Path
        drawWindingPath();
    }

    function drawWindingPath() {
        const steps = 100;
        const pathData = [];
        const startTheta = -Math.PI / 2 + (baseIndex * (2 * Math.PI) / n);
        const totalAngleSpan = vectorValue * (2 * Math.PI / n);

        for(let i = 0; i <= steps; i++) {
            const t = i / steps;
            const currentTheta = startTheta + (t * totalAngleSpan);
            const r = circleRadius;
            const x = r * Math.cos(currentTheta);
            const y = r * Math.sin(currentTheta);
            if (i === 0) pathData.push(`M ${x} ${y}`);
            else pathData.push(`L ${x} ${y}`);
        }
        vectorPath.setAttribute("d", pathData.join(" "));
    }

    // --- Interaction Logic (Smooth + Snap) ---
    function setupDrag(element, onDrag, onEnd) {
        let isDragging = false;

        const start = (e) => { isDragging = true; e.preventDefault(); };
        const move = (e) => {
            if(!isDragging) return;
            const point = e.touches ? getTouchPos(e) : getMousePos(e);
            onDrag(point);
        };
        const end = () => {
            if(isDragging && onEnd) onEnd();
            isDragging = false;
        };

        element.addEventListener('mousedown', start);
        element.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('mouseup', end);
        window.addEventListener('touchend', end);
    }

    function getMousePos(evt) {
        const CTM = svgEl.getScreenCTM();
        return { x: (evt.clientX - CTM.e) / CTM.a, y: (evt.clientY - CTM.f) / CTM.d };
    }
    function getTouchPos(evt) {
        const CTM = svgEl.getScreenCTM();
        const t = evt.touches[0];
        return { x: (t.clientX - CTM.e) / CTM.a, y: (t.clientY - CTM.f) / CTM.d };
    }

    // 1. Slider Interaction
    setupDrag(sliderHandleGroup,
        (pos) => {
            const localX = pos.x - 50;
            vectorValue = (localX - sliderCenter) / sliderStepPx;
            updateVisuals();
        },
        () => {
            vectorValue = Math.round(vectorValue);
            updateVisuals();
        }
    );

    // 2. Base Interaction
    setupDrag(baseHandle,
        (pos) => {
            const localX = pos.x - 250;
            const localY = pos.y - 220;
            let angle = Math.atan2(localY, localX) + (Math.PI / 2);
            if (angle < 0) angle += 2 * Math.PI;

            // Fractional index
            const index = angle / ((2 * Math.PI) / n);
            baseIndex = mod(index, n);
            updateVisuals();
        },
        () => {
            baseIndex = mod(Math.round(baseIndex), n);
            updateVisuals();
        }
    );

    // 3. Tip Interaction
    setupDrag(tipGroup,
        (pos) => {
            const localX = pos.x - 250;
            const localY = pos.y - 220;
            let angle = Math.atan2(localY, localX) + (Math.PI / 2);
            if (angle < 0) angle += 2 * Math.PI;

            // Fractional target
            const targetIndex = angle / ((2 * Math.PI) / n);
            baseIndex = mod(targetIndex - vectorValue, n);
            updateVisuals();
        },
        () => {
            baseIndex = mod(Math.round(baseIndex), n);
            updateVisuals();
        }
    );

    // --- Init ---
    inputEl.addEventListener('input', parseInput);
    renderSliderTicks();
    parseInput();

</script>
</body>
</html>
