<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Stacking Physics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .controls {
            margin-bottom: 15px;
            font-size: 16px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            padding: 5px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            width: 180px;
            height: 35px;
        }
        button:hover {
            background-color: #c0392b;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #repositionBtn {
            background-color: #f39c12;
            display: none;
        }
        #repositionBtn:hover {
            background-color: #d68910;
        }
        #resetBtn {
            background-color: #7f8c8d;
            width: auto;
        }
        #resetBtn:hover {
            background-color: #616a6b;
        }
        #zoomBtn {
            background-color: #9b59b6;
        }
        #zoomBtn:hover {
            background-color: #8e44ad;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            z-index: 2;
            cursor: pointer;
        }
        .slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
            z-index: 1;
            pointer-events: none;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #16a085;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        canvas {
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="numBlocks">Number of Blocks: </label>
        <select id="numBlocks"></select>
        <button id="letGoBtn">Let Go</button>
        <button id="repositionBtn">Reposition</button>
        <button id="resetBtn">Reset Tower</button>
    </div>
    <div class="controls" style="margin-top: -5px;">
        <button id="zoomBtn">Zoom (and hint)</button>
        <label class="toggle-container" for="highlightToggle">
            Highlight Unstable Substacks
            <span class="switch">
                <input type="checkbox" id="highlightToggle">
                <span class="slider"></span>
            </span>
        </label>
        <span id="zoomHint" style="display:none; color:#8e44ad; font-weight:bold; font-size:14px;">now click a block to zoom in on</span>
    </div>

    <canvas id="simCanvas" width="800" height="600"></canvas>
    <canvas id="zoomCanvas" width="800" height="250" style="display:none; margin-top:15px;"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const select = document.getElementById('numBlocks');
        const letGoBtn = document.getElementById('letGoBtn');
        const repositionBtn = document.getElementById('repositionBtn');
        const resetBtn = document.getElementById('resetBtn');
        const zoomBtn = document.getElementById('zoomBtn');
        const highlightToggle = document.getElementById('highlightToggle');
        const zoomHint = document.getElementById('zoomHint');
        const zoomCanvas = document.getElementById('zoomCanvas');
        const zoomCtx = zoomCanvas.getContext('2d');

        // Simulation Constants
        const LEDGE_X = 200;
        const LEDGE_Y = 450;
        const LEDGE_W = 300;
        const LEDGE_H = 150;
        const BLOCK_W = 120;
        const BLOCK_H = 30;
        const EPSILON = 0.5;

        // Physics Tuning Parameters
        const AIR_GAP = 0.001;
        const PHYSICS_HZ = 1000;

        // State
        let blocks = [];
        let snapshot = [];
        let active = false;
        let draggedIndex = -1;
        let dragOffsetX = 0;
        let hoveredIndex = -1;
        let zoomMode = false;
        let zoomedBlockIndex = -1;
        let zoomActive = false;
        let zoomHovered = false;
        let zoomDragOffsetX = 0;
        let violations = [];
        let showHighlight = false;
        let physicsMode = false;
        let animationFrameId;

        // Matter.js setup
        const Engine = Matter.Engine,
              World = Matter.World,
              Bodies = Matter.Bodies,
              Runner = Matter.Runner;

        let engine, runner, matterBlocks = [];

        // Initialize Dropdown
        for(let i = 1; i <= 15; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i;
            if(i === 12) opt.selected = true;
            select.appendChild(opt);
        }

        select.addEventListener('change', init);
        resetBtn.addEventListener('click', init);
        zoomBtn.addEventListener('click', () => {
            zoomMode = !zoomMode;
            zoomBtn.style.border = zoomMode ? "2px solid #2c3e50" : "none";
            zoomHint.style.display = zoomMode ? "inline-block" : "none";
            if (!zoomMode) {
                zoomedBlockIndex = -1;
                zoomCanvas.style.display = 'none';
            }
        });
        highlightToggle.addEventListener('change', (e) => {
            showHighlight = e.target.checked;
        });
        letGoBtn.addEventListener('click', startPhysics);
        repositionBtn.addEventListener('click', reposition);

        function init() {
            if(runner) Runner.stop(runner);
            if(engine) Engine.clear(engine);
            cancelAnimationFrame(animationFrameId);

            physicsMode = false;
            letGoBtn.style.display = 'inline-block';
            repositionBtn.style.display = 'none';

            zoomMode = false;
            zoomedBlockIndex = -1;
            zoomCanvas.style.display = 'none';
            zoomBtn.style.border = "none";
            zoomHint.style.display = "none";

            blocks = [];
            snapshot = [];
            violations = [];
            const n = parseInt(select.value);
            const startX = LEDGE_X + LEDGE_W - BLOCK_W;

            for(let i = 0; i < n; i++) {
                blocks.push({
                    x: startX,
                    y: LEDGE_Y - (i + 1) * BLOCK_H,
                    w: BLOCK_W,
                    h: BLOCK_H,
                    angle: 0
                });
                violations.push(false);
            }
            active = false;
            draggedIndex = -1;
            hoveredIndex = -1;

            checkViolations();
            loop();
        }

        function checkViolations() {
            for(let i = 0; i < blocks.length; i++) {
                let sumX = 0;
                let numMoving = blocks.length - i;
                for(let j = i; j < blocks.length; j++) {
                    sumX += (blocks[j].x + blocks[j].w / 2);
                }
                const cmX = sumX / numMoving;

                let pivotLeft, pivotRight;
                if(i === 0) {
                    pivotLeft = LEDGE_X;
                    pivotRight = LEDGE_X + LEDGE_W;
                } else {
                    pivotLeft = blocks[i - 1].x;
                    pivotRight = blocks[i - 1].x + blocks[i - 1].w;
                }

                violations[i] = (cmX < pivotLeft - EPSILON || cmX > pivotRight + EPSILON);
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('mousemove', (e) => {
            if(physicsMode) return;
            const pos = getMousePos(e);

            if(active && draggedIndex !== -1) {
                const proposedX = pos.x - dragOffsetX;
                const dx = proposedX - blocks[draggedIndex].x;

                for(let i = draggedIndex; i < blocks.length; i++) {
                    blocks[i].x += dx;
                }
                checkViolations();
            } else {
                hoveredIndex = -1;
                canvas.style.cursor = 'default';
                for(let i = blocks.length - 1; i >= 0; i--) {
                    const b = blocks[i];
                    if(pos.x >= b.x && pos.x <= b.x + b.w &&
                       pos.y >= b.y && pos.y <= b.y + b.h) {
                        hoveredIndex = i;
                        canvas.style.cursor = 'grab';
                        break;
                    }
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            if(physicsMode || hoveredIndex === -1) return;
            if(zoomMode) {
                zoomedBlockIndex = hoveredIndex;
                zoomCanvas.style.display = 'block';
                zoomHint.style.display = 'none';
            }
            active = true;
            draggedIndex = hoveredIndex;
            dragOffsetX = getMousePos(e).x - blocks[draggedIndex].x;
            canvas.style.cursor = 'grabbing';
        });

        window.addEventListener('mouseup', () => {
            if(physicsMode) return;
            active = false;
            draggedIndex = -1;
            zoomActive = false;
            canvas.style.cursor = hoveredIndex !== -1 ? 'grab' : 'default';
            if (zoomHovered && zoomedBlockIndex !== -1) zoomCanvas.style.cursor = 'grab';
        });

        canvas.addEventListener('mouseleave', () => {
            if(!active) hoveredIndex = -1;
        });

        function getZoomWorldPos(e) {
            if (zoomedBlockIndex === -1) return {x:0, y:0};
            const rect = zoomCanvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const b = blocks[zoomedBlockIndex];
            const pivotY = zoomedBlockIndex === 0 ? LEDGE_Y : blocks[zoomedBlockIndex - 1].y;
            const pivotRight = zoomedBlockIndex === 0 ? LEDGE_X + LEDGE_W : blocks[zoomedBlockIndex - 1].x + blocks[zoomedBlockIndex - 1].w;
            const cx = pivotRight;
            const cy = pivotY;
            const scale = 4;
            return {
                x: (mx - zoomCanvas.width / 2) / scale + cx,
                y: (my - zoomCanvas.height / 2) / scale + cy
            };
        }

        zoomCanvas.addEventListener('mousemove', (e) => {
            if(physicsMode || zoomedBlockIndex === -1) return;
            const pos = getZoomWorldPos(e);
            const b = blocks[zoomedBlockIndex];
            if(zoomActive) {
                const proposedX = pos.x - zoomDragOffsetX;
                const dx = proposedX - b.x;
                for(let i = zoomedBlockIndex; i < blocks.length; i++) {
                    blocks[i].x += dx;
                }
                checkViolations();
            } else {
                if(pos.x >= b.x && pos.x <= b.x + b.w && pos.y >= b.y && pos.y <= b.y + b.h) {
                    zoomHovered = true;
                    zoomCanvas.style.cursor = 'grab';
                } else {
                    zoomHovered = false;
                    zoomCanvas.style.cursor = 'default';
                }
            }
        });

        zoomCanvas.addEventListener('mousedown', (e) => {
            if(physicsMode || !zoomHovered || zoomedBlockIndex === -1) return;
            zoomActive = true;
            zoomDragOffsetX = getZoomWorldPos(e).x - blocks[zoomedBlockIndex].x;
            zoomCanvas.style.cursor = 'grabbing';
        });

        function startPhysics() {
            if(physicsMode) return;
            physicsMode = true;
            
            zoomMode = false;
            zoomedBlockIndex = -1;
            zoomCanvas.style.display = 'none';
            zoomBtn.style.border = "none";
            zoomHint.style.display = "none";

            letGoBtn.style.display = 'none';
            repositionBtn.style.display = 'inline-block';

            hoveredIndex = -1;
            canvas.style.cursor = 'default';

            snapshot = blocks.map(b => ({ ...b }));

            engine = Engine.create({
                positionIterations: 16,
                velocityIterations: 16
            });
            matterBlocks = [];

            const ledgeBody = Bodies.rectangle(
                LEDGE_X + LEDGE_W / 2,
                LEDGE_Y + LEDGE_H / 2,
                LEDGE_W,
                LEDGE_H,
                { isStatic: true, friction: 1.0 }
            );
            World.add(engine.world, ledgeBody);

            for(let i = 0; i < blocks.length; i++) {
                const b = blocks[i];

                // AIR GAP LOGIC: Stack upwards with tiny separations
                const yOffset = -(i * AIR_GAP);

                const body = Bodies.rectangle(
                    b.x + b.w / 2,
                    (b.y + b.h / 2) + yOffset,
                    b.w,
                    b.h,
                    {
                        friction: 1.0,
                        density: 0.005,
                        restitution: 0,
                        frictionAir: 0.02,
                        sleepThreshold: 15
                    }
                );
                matterBlocks.push(body);
                World.add(engine.world, body);
            }

            // High-frequency fixed timestep runner
            runner = Runner.create({
                isFixed: true,
                delta: 1000 / PHYSICS_HZ
            });
            Runner.run(runner, engine);
        }

        function reposition() {
            if(!physicsMode) return;

            if(runner) Runner.stop(runner);
            if(engine) Engine.clear(engine);

            blocks = snapshot.map(s => ({ ...s }));

            physicsMode = false;
            letGoBtn.style.display = 'inline-block';
            repositionBtn.style.display = 'none';

            checkViolations();
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if(physicsMode && matterBlocks.length > 0) {
                for(let i = 0; i < blocks.length; i++) {
                    const body = matterBlocks[i];
                    blocks[i].x = body.position.x - blocks[i].w / 2;
                    blocks[i].y = body.position.y - blocks[i].h / 2;
                    blocks[i].angle = body.angle;
                }
            }

            ctx.fillStyle = '#444';
            ctx.fillRect(LEDGE_X, LEDGE_Y, LEDGE_W, LEDGE_H);

            for(let i = 0; i < blocks.length; i++) {
                const b = blocks[i];
                ctx.save();
                ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
                ctx.rotate(b.angle);

                ctx.fillStyle = '#3498db';
                ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
                ctx.strokeStyle = '#2980b9';
                ctx.lineWidth = 2;
                ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);

                ctx.restore();
            }

            if(!physicsMode) {
                if(hoveredIndex !== -1) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    for(let i = hoveredIndex; i < blocks.length; i++) {
                        ctx.fillRect(blocks[i].x, blocks[i].y, blocks[i].w, blocks[i].h);
                    }
                }

                if (showHighlight) {
                    ctx.fillStyle = 'rgba(231, 76, 60, 0.25)';
                    for(let i = 0; i < violations.length; i++) {
                        if(violations[i]) {
                            for(let j = i; j < blocks.length; j++) {
                                ctx.fillRect(blocks[j].x, blocks[j].y, blocks[j].w, blocks[j].h);
                            }
                        }
                    }
                }

                for(let i = 0; i < blocks.length; i++) {
                    let sumX = 0, sumY = 0;
                    let numMoving = blocks.length - i;
                    for(let j = i; j < blocks.length; j++) {
                        sumX += (blocks[j].x + blocks[j].w / 2);
                        sumY += (blocks[j].y + blocks[j].h / 2);
                    }
                    const cmX = sumX / numMoving;
                    const cmY = sumY / numMoving;

                    const pivotY = i === 0 ? LEDGE_Y : blocks[i - 1].y;

                    const isViolating = showHighlight && violations[i];
                    const isHovered = (i === hoveredIndex) || (active && i === draggedIndex);
                    const isEmphasized = isViolating || isHovered;

                    ctx.globalAlpha = isEmphasized ? 1.0 : 0.3;
                    ctx.strokeStyle = isViolating ? '#c0392b' : '#2c3e50';
                    ctx.fillStyle = isViolating ? '#c0392b' : '#2c3e50';
                    ctx.lineWidth = isEmphasized ? 2 : 1;

                    ctx.beginPath();
                    ctx.moveTo(cmX, cmY);
                    ctx.lineTo(cmX, pivotY);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(cmX, pivotY, 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(cmX, cmY, 8, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(cmX - 12, cmY);
                    ctx.lineTo(cmX + 12, cmY);
                    ctx.moveTo(cmX, cmY - 12);
                    ctx.lineTo(cmX, cmY + 12);
                    ctx.stroke();

                    ctx.globalAlpha = 1.0;
                }
            }

            if (!physicsMode && zoomedBlockIndex !== -1) {
                zoomCtx.clearRect(0, 0, zoomCanvas.width, zoomCanvas.height);
                const b = blocks[zoomedBlockIndex];
                const pivotY = zoomedBlockIndex === 0 ? LEDGE_Y : blocks[zoomedBlockIndex - 1].y;
                const pivotRight = zoomedBlockIndex === 0 ? LEDGE_X + LEDGE_W : blocks[zoomedBlockIndex - 1].x + blocks[zoomedBlockIndex - 1].w;
                const cx = pivotRight;
                const cy = pivotY;
                const scale = 4;

                zoomCtx.save();
                zoomCtx.translate(zoomCanvas.width / 2, zoomCanvas.height / 2);
                zoomCtx.scale(scale, scale);
                zoomCtx.translate(-cx, -cy);

                if (zoomedBlockIndex === 0) {
                    zoomCtx.fillStyle = 'black';
                    zoomCtx.fillRect(LEDGE_X, LEDGE_Y, LEDGE_W, LEDGE_H);
                } else {
                    const sb = blocks[zoomedBlockIndex - 1];
                    zoomCtx.fillStyle = '#3498db';
                    zoomCtx.fillRect(sb.x, sb.y, sb.w, sb.h);
                    zoomCtx.strokeStyle = '#2980b9';
                    zoomCtx.lineWidth = 2/scale;
                    zoomCtx.strokeRect(sb.x, sb.y, sb.w, sb.h);
                }
                zoomCtx.stroke();

                zoomCtx.fillStyle = zoomHovered || zoomActive ? 'rgba(52, 152, 219, 0.8)' : '#3498db';
                zoomCtx.fillRect(b.x, b.y, b.w, b.h);
                zoomCtx.strokeStyle = '#2980b9';
                zoomCtx.lineWidth = 2/scale;
                zoomCtx.strokeRect(b.x, b.y, b.w, b.h);

                zoomCtx.strokeStyle = 'black';
                zoomCtx.fillStyle = 'black';
                zoomCtx.font = `${12/scale}px sans-serif`;
                zoomCtx.textAlign = 'center';
                zoomCtx.lineWidth = 1.5/scale;
                
                zoomCtx.beginPath();
                let n = 1;
                while(b.w / (2 * n) >= 0.5 / scale) {
                    const tickX = b.x + b.w - b.w / (2 * n);
                    zoomCtx.moveTo(tickX, b.y + b.h - 6/scale);
                    zoomCtx.lineTo(tickX, b.y + b.h + 6/scale);
                    n++;
                }
                zoomCtx.stroke();

                for (let i = 1; i <= 6; i++) {
                    const tickX = b.x + b.w - b.w / (2 * i);
                    if (i % 2 === 1) {
                        zoomCtx.textBaseline = 'bottom';
                        zoomCtx.fillText(`1/${2*i}`, tickX, b.y + b.h - 8/scale);
                    } else {
                        zoomCtx.textBaseline = 'top';
                        zoomCtx.fillText(`1/${2*i}`, tickX, b.y + b.h + 8/scale);
                    }
                }

                let sumX = 0, sumY = 0;
                let numMoving = blocks.length - zoomedBlockIndex;
                for(let j = zoomedBlockIndex; j < blocks.length; j++) {
                    sumX += (blocks[j].x + blocks[j].w / 2);
                    sumY += (blocks[j].y + blocks[j].h / 2);
                }
                const cmX = sumX / numMoving;
                const cmY = sumY / numMoving;

                const isViolating = showHighlight && violations[zoomedBlockIndex];
                zoomCtx.strokeStyle = isViolating ? '#c0392b' : '#2c3e50';
                zoomCtx.fillStyle = isViolating ? '#c0392b' : '#2c3e50';
                zoomCtx.lineWidth = 2/scale;

                zoomCtx.beginPath();
                zoomCtx.arc(cmX, pivotY, 4/scale, 0, Math.PI * 2);
                zoomCtx.fill();

                zoomCtx.beginPath();
                zoomCtx.setLineDash([4/scale, 4/scale]);
                zoomCtx.moveTo(cmX, pivotY);
                zoomCtx.lineTo(cmX, cmY);
                zoomCtx.stroke();
                zoomCtx.setLineDash([]);

                zoomCtx.restore();
            }

            animationFrameId = requestAnimationFrame(loop);
        }

        init();
    </script>
</body>
</html>
