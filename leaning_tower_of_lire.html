<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Stacking Simulation</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .controls {
            margin-bottom: 15px;
            font-size: 16px;
        }
        canvas {
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="numBlocks">Number of Blocks: </label>
        <select id="numBlocks"></select>
    </div>

    <canvas id="simCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const select = document.getElementById('numBlocks');

        // Simulation Constants
        const LEDGE_X = 100;
        const LEDGE_Y = 450;
        const LEDGE_W = 300;
        const LEDGE_H = 150;

        const BLOCK_W = 120;
        const BLOCK_H = 30;

        let blocks = [];
        let active = false;
        let draggedIndex = -1;
        let dragOffsetX = 0;

        // Initialize Dropdown
        for(let i = 1; i <= 15; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i;
            if(i === 5) opt.selected = true;
            select.appendChild(opt);
        }

        select.addEventListener('change', init);

        function init() {
            blocks = [];
            const n = parseInt(select.value);
            const startX = LEDGE_X + LEDGE_W - BLOCK_W; // Flush with ledge's right edge

            for(let i = 0; i < n; i++) {
                blocks.push({
                    x: startX,
                    y: LEDGE_Y - (i + 1) * BLOCK_H,
                    w: BLOCK_W,
                    h: BLOCK_H
                });
            }
            active = false;
            draggedIndex = -1;
            draw();
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            // Check top-down to select the highest block if overlapping perfectly
            for(let i = blocks.length - 1; i >= 0; i--) {
                const b = blocks[i];
                if(pos.x >= b.x && pos.x <= b.x + b.w &&
                   pos.y >= b.y && pos.y <= b.y + b.h) {
                    active = true;
                    draggedIndex = i;
                    dragOffsetX = pos.x - b.x;
                    draw();
                    break;
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if(!active || draggedIndex === -1) return;

            const pos = getMousePos(e);
            const proposedX = pos.x - dragOffsetX;
            let dx = proposedX - blocks[draggedIndex].x;

            const numMoving = blocks.length - draggedIndex;

            // Calculate current CM X of the moving stack
            let sumX = 0;
            for(let i = draggedIndex; i < blocks.length; i++) {
                sumX += (blocks[i].x + blocks[i].w / 2);
            }
            const currentCMX = sumX / numMoving;

            // Determine pivot constraints (edges of the supporting structure below)
            let pivotLeft, pivotRight;
            if(draggedIndex === 0) {
                pivotLeft = LEDGE_X;
                pivotRight = LEDGE_X + LEDGE_W;
            } else {
                const support = blocks[draggedIndex - 1];
                pivotLeft = support.x;
                pivotRight = support.x + support.w;
            }

            // Constrain movement so CM does not cross the pivot lines
            const max_dx = pivotRight - currentCMX;
            const min_dx = pivotLeft - currentCMX;

            dx = Math.max(min_dx, Math.min(max_dx, dx));

            // Apply constrained movement
            for(let i = draggedIndex; i < blocks.length; i++) {
                blocks[i].x += dx;
            }

            draw();
        });

        window.addEventListener('mouseup', () => {
            active = false;
            draggedIndex = -1;
            draw();
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ledge
            ctx.fillStyle = '#444';
            ctx.fillRect(LEDGE_X, LEDGE_Y, LEDGE_W, LEDGE_H);

            // Draw Blocks
            for(let i = 0; i < blocks.length; i++) {
                const b = blocks[i];
                ctx.fillStyle = '#3498db';
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = '#2980b9';
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x, b.y, b.w, b.h);
            }

            // Draw Active Stack Overlay
            if(active && draggedIndex !== -1) {
                const numMoving = blocks.length - draggedIndex;
                let sumX = 0, sumY = 0;

                for(let i = draggedIndex; i < blocks.length; i++) {
                    sumX += (blocks[i].x + blocks[i].w / 2);
                    sumY += (blocks[i].y + blocks[i].h / 2);
                }
                const cmX = sumX / numMoving;
                const cmY = sumY / numMoving;

                // Pivot bounds computation for dashed lines
                let pivotLeft, pivotRight;
                if(draggedIndex === 0) {
                    pivotLeft = LEDGE_X;
                    pivotRight = LEDGE_X + LEDGE_W;
                } else {
                    pivotLeft = blocks[draggedIndex - 1].x;
                    pivotRight = blocks[draggedIndex - 1].x + blocks[draggedIndex - 1].w;
                }

                // Draw Dashed Pivot Lines
                ctx.beginPath();
                ctx.setLineDash([5, 5]);
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 1;

                ctx.moveTo(pivotLeft, 0);
                ctx.lineTo(pivotLeft, canvas.height);

                ctx.moveTo(pivotRight, 0);
                ctx.lineTo(pivotRight, canvas.height);

                ctx.stroke();
                ctx.setLineDash([]); // Reset dash

                // Draw CM Circle & Crosshair
                ctx.beginPath();
                ctx.arc(cmX, cmY, 12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(231, 76, 60, 0.4)';
                ctx.fill();
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(cmX - 16, cmY);
                ctx.lineTo(cmX + 16, cmY);
                ctx.moveTo(cmX, cmY - 16);
                ctx.lineTo(cmX, cmY + 16);
                ctx.stroke();

                // Draw Gravity Vector
                const gThickness = Math.max(2, numMoving * 2);
                const gLength = numMoving * 15;
                const arrowSize = gThickness * 1.5 + 4;

                ctx.beginPath();
                ctx.moveTo(cmX, cmY);
                ctx.lineTo(cmX, cmY + gLength);
                ctx.strokeStyle = '#2c3e50';
                ctx.lineWidth = gThickness;
                ctx.stroke();

                // Arrow head
                ctx.beginPath();
                ctx.moveTo(cmX - arrowSize, cmY + gLength);
                ctx.lineTo(cmX + arrowSize, cmY + gLength);
                ctx.lineTo(cmX, cmY + gLength + arrowSize * 1.2);
                ctx.fillStyle = '#2c3e50';
                ctx.fill();
            }
        }

        // Start Simulation
        init();
    </script>
</body>
</html>
